<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>メンテナンス手帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f6f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mmnote">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root {
  --bg: #f6f7f9;
  --bg-panel: #ffffff;
  --fg: #1d2228;
  --fg-muted: #5d6670;
  --border: #d9dde2;
  --accent: #2c6e9b;
  --on-accent: #ffffff;
  --ok: #2f9e55;
  --warn: #d99a00;
  --error: #d14343;
  --backdrop: rgba(0, 0, 0, 0.45);
  --zoom: 1;
  --radius: calc(10px * var(--zoom));
  --gap: calc(12px * var(--zoom));
  --fs-base: calc(16px * var(--zoom));
  --fs-small: calc(13px * var(--zoom));
  --fs-large: calc(22px * var(--zoom));
  --page-width: calc(720px * var(--zoom));
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
html[data-theme="dark"] {
  --bg: #121519;
  --bg-panel: #1b1f24;
  --fg: #e6e9ed;
  --fg-muted: #9aa3ad;
  --border: #2f353c;
  --accent: #6fb3e0;
  --on-accent: #0e1216;
  --backdrop: rgba(0, 0, 0, 0.6);
}
@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) {
    --bg: #121519; --bg-panel: #1b1f24; --fg: #e6e9ed; --fg-muted: #9aa3ad; --border: #2f353c;
    --accent: #6fb3e0; --on-accent: #0e1216; --backdrop: rgba(0, 0, 0, 0.6);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: var(--fs-base);
  line-height: 1.5;
  height: 100dvh;
  max-width: var(--page-width);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }

/* ツールバー */
#toolbar {
  display: flex; justify-content: flex-end; align-items: center; gap: calc(var(--gap) / 2);
  padding: calc(var(--gap) / 2) var(--gap);
  padding-top: max(calc(var(--gap) / 2), env(safe-area-inset-top));
  transition: opacity 0.6s;
}
#toolbar.idle { opacity: 0.15; }
/* 大きな拡大率では幅に収まるまで縮む(44px より小さくはしない) */
.icon-btn {
  flex: 0 1 2.4em; aspect-ratio: 1; min-width: 44px; min-height: 44px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg-panel); color: var(--fg);
  cursor: pointer; display: grid; place-items: center; padding: 0;
}
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.icon-btn svg { width: 1.4em; height: 1.4em; fill: currentColor; }

[hidden] { display: none !important; }

/* 本文 */
#content { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 var(--gap); }
#db-message { color: var(--error); display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--gap) / 2); margin-bottom: var(--gap); }
#db-message p { margin: 0; flex: 1 1 12em; }
#page-title { margin: 0 0 calc(var(--gap) / 2); font-size: var(--fs-large); font-weight: 400; }
.tab-pane { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; padding-bottom: var(--gap); }
.tab-pane[hidden] { display: none; }
.empty { color: var(--fg-muted); padding: var(--gap) 0; }

/* ステータス帯 */
#status-bar {
  display: flex; align-items: center; gap: var(--gap);
  padding: calc(var(--gap) / 2) var(--gap);
  border-top: 1px solid var(--border);
  font-size: var(--fs-small); color: var(--fg-muted);
}
#status-counts { flex: none; }
#status-message { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
#status-message[data-level="error"] { color: var(--error); }
#status-dot { flex: none; width: 0.8em; height: 0.8em; border-radius: 50%; background: var(--ok); }
#status-dot[data-level="warn"] { background: var(--warn); }
#status-dot[data-level="error"] { background: var(--error); }

/* タブバー */
#tabbar {
  display: flex; border-top: 1px solid var(--border); background: var(--bg-panel);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex: 1; min-height: max(60px, 3.8em); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: none; border: none; color: var(--fg-muted); cursor: pointer; font-size: var(--fs-small); padding: 4px 0;
}
.tab svg { width: 1.8em; height: 1.8em; fill: currentColor; }
.tab[aria-selected="true"] { color: var(--accent); }

/* 一覧と右下の追加ボタン */
.list-tools { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: calc(var(--gap) / 2); margin-bottom: var(--gap); }
.list-tools > input { grid-column: 1 / -1; }
.list-tools > input, .list-tools > select { width: 100%; min-width: 0; }
.row-list { list-style: none; margin: 0; padding: 0 0 calc(64px * var(--zoom) + var(--gap)); display: flex; flex-direction: column; gap: calc(var(--gap) / 2); }
.row-item {
  display: flex; align-items: center; gap: var(--gap); width: 100%; min-height: 44px; text-align: left;
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: calc(var(--gap) / 2); cursor: pointer;
}
.cover {
  flex: none; width: calc(64px * var(--zoom)); aspect-ratio: 1; border-radius: calc(8px * var(--zoom));
  background: var(--bg); border: 1px solid var(--border); color: var(--fg-muted);
  display: grid; place-items: center; overflow: hidden;
}
.cover svg { width: 55%; height: 55%; fill: currentColor; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.row-text { flex: 1; min-width: 0; }
.row-title, .row-sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { font-size: var(--fs-small); color: var(--fg-muted); }
.fab {
  position: absolute; right: var(--gap); bottom: var(--gap);
  width: max(56px, calc(56px * var(--zoom))); aspect-ratio: 1; border-radius: 50%; border: none; padding: 0;
  background: var(--accent); color: var(--on-accent); cursor: pointer; display: grid; place-items: center;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}
.fab svg { width: 50%; height: 50%; fill: currentColor; }

/* 詳細 */
.detail-head { display: flex; align-items: center; gap: calc(var(--gap) / 2); margin-bottom: var(--gap); }
.detail-head h2 { flex: 1; min-width: 0; margin: 0; font-size: var(--fs-large); font-weight: 400; overflow-wrap: anywhere; }
.detail-section { margin-bottom: var(--gap); }
.detail-section > h3 {
  margin: 0 0 calc(var(--gap) / 2); padding-bottom: 0.2em; border-bottom: 1px solid var(--border);
  font-size: var(--fs-base); font-weight: 400; color: var(--fg-muted);
}
.kv { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 0.3em var(--gap); margin: 0; }
.kv dt { color: var(--fg-muted); overflow-wrap: anywhere; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.note-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* シートの入力欄 */
.form-row { display: flex; flex-direction: column; gap: 0.2em; margin-bottom: var(--gap); }
.form-row > label, .form-label { color: var(--fg-muted); font-size: var(--fs-small); }
.form-row > input, .form-row > select, .form-row > textarea { width: 100%; min-width: 0; }
.spec-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: calc(var(--gap) / 2); align-items: center; margin-bottom: calc(var(--gap) / 2); }
.spec-row > input { width: 100%; min-width: 0; }
.btn-icon-text { display: inline-flex; align-items: center; gap: 0.3em; }
.btn-icon-text svg { width: 1.2em; height: 1.2em; fill: currentColor; }

/* 写真欄(横並びのサムネイル) */
.photo-strip { display: flex; gap: calc(var(--gap) / 2); overflow-x: auto; padding-bottom: 4px; }
.photo-tile {
  position: relative; flex: none; width: max(44px, calc(88px * var(--zoom))); aspect-ratio: 1; padding: 0;
  border-radius: calc(8px * var(--zoom)); border: 1px solid var(--border); background: var(--bg); color: var(--fg-muted);
  overflow: hidden; display: grid; place-items: center;
}
.photo-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-open { width: 100%; height: 100%; padding: 0; border: none; background: none; cursor: pointer; display: block; }
.photo-remove {
  position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 0; border: none; background: none;
  cursor: pointer; display: grid; place-items: center;
}
.photo-remove svg { width: 26px; height: 26px; padding: 4px; border-radius: 50%; background: rgba(0, 0, 0, 0.6); fill: #fff; }
.photo-add { cursor: pointer; }
.photo-add svg { width: 40%; height: 40%; fill: currentColor; }
.photo-add:disabled { opacity: 0.4; cursor: default; }
.photo-note { margin: 0.3em 0 0; font-size: var(--fs-small); color: var(--fg-muted); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* 設定タブ */
.settings-section { border-bottom: 1px solid var(--border); padding: calc(var(--gap) / 2) 0; }
.settings-section > summary { cursor: pointer; padding: calc(var(--gap) / 2) 0; min-height: 44px; display: flex; align-items: center; font-size: calc(var(--fs-base) * 1.1); }
.settings-section > summary::before { content: ''; width: 0.5em; height: 0.5em; margin-right: 0.6em; border-right: 2px solid var(--fg-muted); border-bottom: 2px solid var(--fg-muted); transform: rotate(-45deg); transition: transform 0.2s; }
.settings-section[open] > summary::before { transform: rotate(45deg); }
.settings-section > summary::-webkit-details-marker { display: none; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap); align-items: center; margin-bottom: var(--gap); }
.field > label { color: var(--fg-muted); }
.field > input, .field > select { width: 100%; min-width: 0; }

/* 入力欄とボタン */
select, input, textarea, .btn {
  background: var(--bg); border: 1px solid var(--border); border-radius: calc(6px * var(--zoom)); padding: 0.4em 0.6em;
}
input, select, textarea { font-size: max(16px, var(--fs-base)); }
input, select, .btn { min-height: 44px; }
textarea { width: 100%; resize: vertical; }
.btn { cursor: pointer; padding: 0 1em; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { color: var(--error); }

/* シート(下から出る)と確認ダイアログ */
dialog { color: var(--fg); background: var(--bg-panel); border: 1px solid var(--border); padding: var(--gap); }
dialog::backdrop { background: var(--backdrop); }
dialog#sheet {
  width: 100%; max-width: var(--page-width); max-height: 90dvh;
  margin: auto auto 0; border-radius: var(--radius) var(--radius) 0 0; border-bottom: none;
  padding-bottom: max(var(--gap), env(safe-area-inset-bottom));
}
dialog#sheet[open] { display: flex; flex-direction: column; animation: sheet-in 0.2s ease-out; }
@keyframes sheet-in { from { transform: translateY(100%); } to { transform: none; } }
#sheet-form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
#sheet-title { margin: 0 0 var(--gap); font-size: var(--fs-large); font-weight: 400; outline: none; }
#sheet-body { flex: 1; min-height: 0; overflow-y: auto; }
#sheet-error { color: var(--error); min-height: 1.5em; margin: calc(var(--gap) / 2) 0; }
dialog#confirm { width: min(90vw, calc(24em * var(--zoom))); border-radius: var(--radius); }
#confirm-message { margin: 0 0 var(--gap); white-space: pre-wrap; }
.dialog-actions { display: flex; justify-content: flex-end; gap: calc(var(--gap) / 2); }
/* 写真の拡大表示(全画面) */
dialog#viewer { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: none; background: #000; color: #fff; }
dialog#viewer[open] { display: flex; flex-direction: column; }
#viewer-stage { position: relative; flex: 1; min-height: 0; margin-top: env(safe-area-inset-top); }
#viewer-stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#viewer-message { margin: var(--gap); }
#viewer .btn { color: var(--fg); }
#viewer .btn.danger { color: var(--error); }
.viewer-actions {
  display: flex; flex-wrap: wrap; justify-content: flex-end; gap: calc(var(--gap) / 2);
  padding: var(--gap); padding-bottom: max(var(--gap), env(safe-area-inset-bottom));
}
</style>
</head>

<script id="app-logic">
const Logic = (() => {
  const SETTINGS_VERSION = 1;
  const TABS = ['equipment', 'dues', 'records', 'settings'];
  const DEFAULT_SETTINGS = { theme: 'auto', zoom: 100, lang: 'ja', dueSoonDays: 30, currency: '¥' };
  // 表示だけに効くキー(データの再計算が要らない)
  const DISPLAY_ONLY_KEYS = ['theme', 'zoom', 'lang'];
  const ZOOM_MIN = 50;
  const ZOOM_MAX = 200;
  const ZOOM_STEP = 10;

  // 各キーの検証。正しければ正規化した値、だめなら undefined を返す。
  const VALIDATORS = {
    theme: (v) => (['auto', 'light', 'dark'].includes(v) ? v : undefined),
    lang: (v) => (['ja', 'en'].includes(v) ? v : undefined),
    zoom: (v) => {
      if (typeof v !== 'number' || !Number.isFinite(v)) return undefined;
      const r = Math.round(v / ZOOM_STEP) * ZOOM_STEP;
      return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, r));
    },
    dueSoonDays: (v) => (Number.isInteger(v) && v >= 1 && v <= 180 ? v : undefined),
    currency: (v) => (typeof v === 'string' && Array.from(v).length <= 4 ? v : undefined),
  };
  const NUMERIC_KEYS = ['zoom', 'dueSoonDays'];

  // 文字列で来る値(URL クエリ、入力欄)を型に合わせる
  function coerce(key, value) {
    if (NUMERIC_KEYS.includes(key) && typeof value === 'string') {
      return value.trim() === '' ? NaN : Number(value);
    }
    return value;
  }

  function mergeSettings(base, patch) {
    const out = { ...base };
    if (!patch || typeof patch !== 'object') return out;
    for (const key of Object.keys(DEFAULT_SETTINGS)) {
      if (!(key in patch)) continue;
      const v = VALIDATORS[key](coerce(key, patch[key]));
      if (v !== undefined) out[key] = v;
    }
    return out;
  }

  function detectLang(navigatorLang) {
    return typeof navigatorLang === 'string' && navigatorLang.toLowerCase().startsWith('ja') ? 'ja' : 'en';
  }

  function loadStored(jsonText, navigatorLang) {
    const base = { ...DEFAULT_SETTINGS, lang: detectLang(navigatorLang) };
    if (typeof jsonText !== 'string') return base;
    let raw;
    try { raw = JSON.parse(jsonText); } catch { return base; }
    if (!raw || raw.version !== SETTINGS_VERSION || !raw.settings || typeof raw.settings !== 'object') return base;
    return mergeSettings(base, raw.settings);
  }

  function parseQuery(search) {
    const params = new URLSearchParams(search || '');
    const settings = {};
    for (const key of Object.keys(DEFAULT_SETTINGS)) {
      if (!params.has(key)) continue;
      const v = VALIDATORS[key](coerce(key, params.get(key)));
      if (v !== undefined) settings[key] = v;
    }
    const tab = params.get('tab');
    return { settings, save: params.get('save') === '1', tab: TABS.includes(tab) ? tab : null };
  }

  function stepZoom(current, dir) {
    return VALIDATORS.zoom(current + (dir < 0 ? -ZOOM_STEP : ZOOM_STEP));
  }

  function zoomOptions() {
    const out = [];
    for (let z = ZOOM_MIN; z <= ZOOM_MAX; z += ZOOM_STEP) out.push(z);
    return out;
  }

  function effectiveTheme(setting, prefersDark) {
    if (setting === 'light' || setting === 'dark') return setting;
    return prefersDark ? 'dark' : 'light';
  }

  // ---- データの検証と正規化 ----
  const CATEGORIES = ['vehicle', 'machine', 'facility', 'other'];
  const KINDS = ['inspection', 'repair', 'replacement', 'cleaning', 'other'];
  const LIMITS = { name: 60, title: 80, text: 200, note: 2000, specs: 30, photos: 10, meterUnit: 8 };

  const cpLen = (s) => Array.from(s).length;
  const clip = (s, n) => { const a = Array.from(s); return a.length > n ? a.slice(0, n).join('') : s; };
  const str = (v) => (typeof v === 'string' ? v : '');

  function isDate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const [y, m, d] = s.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
  }
  const isBlank = (v) => v === null || v === undefined || v === '';

  function validateEquipment(e) {
    const errs = [];
    const name = str(e.name).trim();
    if (!name) errs.push('err_name_required');
    else if (cpLen(name) > LIMITS.name) errs.push('err_name_long');
    if (!isBlank(e.acquiredOn) && !isDate(e.acquiredOn)) errs.push('err_date_invalid');
    const texts = [e.maker, e.model, e.serial];
    const specs = Array.isArray(e.specs) ? e.specs : [];
    for (const s of specs) texts.push(s && s.label, s && s.value);
    const tooLong = texts.some((v) => typeof v === 'string' && cpLen(v) > LIMITS.text)
      || specs.length > LIMITS.specs
      || (typeof e.note === 'string' && cpLen(e.note) > LIMITS.note);
    if (tooLong) errs.push('err_text_long');
    return errs;
  }

  function validateRecord(r) {
    const errs = [];
    const title = str(r.title).trim();
    if (!title) errs.push('err_title_required');
    else if (cpLen(title) > LIMITS.title) errs.push('err_title_long');
    const dateOk = isDate(r.date);
    if (!dateOk) errs.push('err_date_invalid');
    if (!isBlank(r.cost) && !(Number.isInteger(r.cost) && r.cost >= 0)) errs.push('err_cost_invalid');
    if (!isBlank(r.meterValue) && !(typeof r.meterValue === 'number' && Number.isFinite(r.meterValue) && r.meterValue >= 0)) errs.push('err_meter_invalid');
    if (!isBlank(r.nextDue)) {
      if (!isDate(r.nextDue)) errs.push('err_date_invalid');
      else if (dateOk && r.nextDue < r.date) errs.push('err_due_before_date');
    }
    const tooLong = (typeof r.vendor === 'string' && cpLen(r.vendor) > LIMITS.text)
      || (typeof r.meterUnit === 'string' && cpLen(r.meterUnit) > LIMITS.meterUnit)
      || (typeof r.note === 'string' && cpLen(r.note) > LIMITS.note);
    if (tooLong) errs.push('err_text_long');
    return [...new Set(errs)];
  }

  const isoOr = (v) => (typeof v === 'string' ? v : '');
  const dateOrNull = (v) => (isDate(v) ? v : null);
  const idList = (v) => (Array.isArray(v) ? v.filter((x) => typeof x === 'string' && x) : []).slice(0, LIMITS.photos);

  function normalizeEquipment(raw) {
    if (!raw || typeof raw !== 'object') return null;
    if (typeof raw.id !== 'string' || !raw.id) return null;
    const name = clip(str(raw.name).trim(), LIMITS.name);
    if (!name) return null;
    const specs = [];
    for (const s of Array.isArray(raw.specs) ? raw.specs : []) {
      if (!s || typeof s !== 'object') continue;
      const cell = (v) => clip(typeof v === 'string' ? v : (typeof v === 'number' && Number.isFinite(v) ? String(v) : ''), LIMITS.text);
      const label = cell(s.label), value = cell(s.value);
      if (!label && !value) continue;
      specs.push({ label, value });
      if (specs.length >= LIMITS.specs) break;
    }
    return {
      id: raw.id,
      name,
      category: CATEGORIES.includes(raw.category) ? raw.category : 'other',
      maker: clip(str(raw.maker), LIMITS.text),
      model: clip(str(raw.model), LIMITS.text),
      serial: clip(str(raw.serial), LIMITS.text),
      acquiredOn: dateOrNull(raw.acquiredOn),
      specs,
      note: clip(str(raw.note), LIMITS.note),
      photoIds: idList(raw.photoIds),
      createdAt: isoOr(raw.createdAt),
      updatedAt: isoOr(raw.updatedAt),
    };
  }

  function normalizeRecord(raw) {
    if (!raw || typeof raw !== 'object') return null;
    if (typeof raw.id !== 'string' || !raw.id) return null;
    if (typeof raw.equipmentId !== 'string' || !raw.equipmentId) return null;
    if (!isDate(raw.date)) return null;
    const title = clip(str(raw.title).trim(), LIMITS.title);
    if (!title) return null;
    return {
      id: raw.id,
      equipmentId: raw.equipmentId,
      date: raw.date,
      kind: KINDS.includes(raw.kind) ? raw.kind : 'other',
      title,
      cost: Number.isInteger(raw.cost) && raw.cost >= 0 ? raw.cost : null,
      vendor: clip(str(raw.vendor), LIMITS.text),
      meterValue: typeof raw.meterValue === 'number' && Number.isFinite(raw.meterValue) && raw.meterValue >= 0 ? raw.meterValue : null,
      meterUnit: clip(str(raw.meterUnit), LIMITS.meterUnit),
      nextDue: dateOrNull(raw.nextDue),
      note: clip(str(raw.note), LIMITS.note),
      photoIds: idList(raw.photoIds),
      createdAt: isoOr(raw.createdAt),
      updatedAt: isoOr(raw.updatedAt),
    };
  }

  function normalizePhotoMeta(raw) {
    if (!raw || typeof raw !== 'object') return null;
    if (typeof raw.id !== 'string' || !raw.id) return null;
    if (raw.ownerType !== 'equipment' && raw.ownerType !== 'record') return null;
    if (typeof raw.ownerId !== 'string' || !raw.ownerId) return null;
    const dim = (v) => (Number.isInteger(v) && v > 0 ? v : 0);
    return { id: raw.id, ownerType: raw.ownerType, ownerId: raw.ownerId, width: dim(raw.width), height: dim(raw.height), createdAt: isoOr(raw.createdAt) };
  }

  // ---- 写真の縮小 ----
  const PHOTO = { max: 1600, quality: 0.85, thumbMax: 320, thumbQuality: 0.7 };
  // 長辺が max を超えるときだけ縮小する(縦横比を保って四捨五入、最小 1)
  function fitSize(width, height, max) {
    const okNum = (v) => typeof v === 'number' && Number.isFinite(v) && v > 0;
    if (!okNum(width) || !okNum(height)) return null;
    const scale = Math.min(1, max / Math.max(width, height));
    return { width: Math.max(1, Math.round(width * scale)), height: Math.max(1, Math.round(height * scale)) };
  }

  function t(lang, key, params) {
    const dict = I18N[lang] || I18N.ja;
    let s = dict[key] ?? key;
    if (params) {
      for (const [k, v] of Object.entries(params)) s = s.replaceAll(`{${k}}`, () => String(v));
    }
    return s;
  }

  // ---- 日付・次回予定(時計は読まない。今日は引数で受け取る) ----
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  const toDateStr = (d) => `${pad(d.getFullYear(), 4)}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseDate = (s) => s.split('-').map(Number);
  function addMonths(s, n) {
    const [y, m, d] = parseDate(s);
    const idx = y * 12 + (m - 1) + n;
    const ny = Math.floor(idx / 12), nm = idx % 12;
    const last = new Date(Date.UTC(ny, nm + 1, 0)).getUTCDate();
    return `${pad(ny, 4)}-${pad(nm + 1)}-${pad(Math.min(d, last))}`;
  }
  function diffDays(from, to) {
    const [fy, fm, fd] = parseDate(from), [ty, tm, td] = parseDate(to);
    return Math.round((Date.UTC(ty, tm - 1, td) - Date.UTC(fy, fm - 1, fd)) / 86400000);
  }
  // 機器 × 区分ごとに、実施日が最新(同日は createdAt が新しい)の記録だけを見る
  function activeDues(records) {
    const latest = new Map();
    for (const r of records) {
      const key = `${r.equipmentId}\u0000${r.kind}`;
      const cur = latest.get(key);
      if (!cur || r.date > cur.date || (r.date === cur.date && r.createdAt > cur.createdAt)) latest.set(key, r);
    }
    return [...latest.values()].filter((r) => r.nextDue)
      .map((r) => ({ equipmentId: r.equipmentId, kind: r.kind, nextDue: r.nextDue, recordId: r.id, title: r.title }));
  }
  function dueStatus(nextDue, today, dueSoonDays) {
    const d = diffDays(today, nextDue);
    return d < 0 ? 'overdue' : d <= dueSoonDays ? 'soon' : 'later';
  }
  function listDues(records, equipment, today, dueSoonDays) {
    const names = new Map(equipment.map((e) => [e.id, e.name]));
    return activeDues(records).filter((d) => names.has(d.equipmentId))
      .map((d) => ({ ...d, status: dueStatus(d.nextDue, today, dueSoonDays), days: diffDays(today, d.nextDue), equipmentName: names.get(d.equipmentId) }))
      .sort((a, b) => (a.nextDue < b.nextDue ? -1 : a.nextDue > b.nextDue ? 1 : a.equipmentName < b.equipmentName ? -1 : a.equipmentName > b.equipmentName ? 1 : 0));
  }
  function equipmentBadge(equipmentId, dues) {
    const d = dues.find((x) => x.equipmentId === equipmentId);
    return d && d.status !== 'later' ? d : null;
  }
  function cascadeDelete(equipmentId, equipment, records) {
    const e = equipment.find((x) => x.id === equipmentId);
    const mine = records.filter((r) => r.equipmentId === equipmentId);
    return { recordIds: mine.map((r) => r.id), photoIds: [...(e ? e.photoIds : []), ...mine.flatMap((r) => r.photoIds)] };
  }

  // 設備の絞り込み(q は大文字小文字無視の部分一致)
  function filterEquipment(list, { q = '', category = '' } = {}) {
    const needle = String(q).trim().toLowerCase();
    return list.filter((e) => {
      if (category && e.category !== category) return false;
      if (!needle) return true;
      const hay = [e.name, e.maker, e.model, e.serial, e.note, ...(e.specs || []).flatMap((s) => [s.label, s.value])];
      return hay.some((v) => String(v == null ? '' : v).toLowerCase().includes(needle));
    });
  }
  function sortEquipment(list, mode, dues) {
    const out = list.slice();
    if (mode === 'due') {
      const earliest = new Map();
      for (const d of dues) {
        if (!earliest.has(d.equipmentId) || d.nextDue < earliest.get(d.equipmentId)) earliest.set(d.equipmentId, d.nextDue);
      }
      const key = (e) => (earliest.has(e.id) ? earliest.get(e.id) : null);
      out.sort((a, b) => {
        const ka = key(a), kb = key(b);
        if (ka === kb) return 0;
        if (ka === null) return 1;
        if (kb === null) return -1;
        return ka < kb ? -1 : 1;
      });
    } else if (mode === 'updated') {
      out.sort((a, b) => (a.updatedAt < b.updatedAt ? 1 : a.updatedAt > b.updatedAt ? -1 : 0));
    } else {
      out.sort((a, b) => String(a.name).localeCompare(String(b.name)));
    }
    return out;
  }
  function filterRecords(records, { q = '', kind = '', equipmentId = '' } = {}) {
    const needle = String(q).trim().toLowerCase();
    return records.filter((r) => {
      if (kind && r.kind !== kind) return false;
      if (equipmentId && r.equipmentId !== equipmentId) return false;
      if (!needle) return true;
      return [r.title, r.vendor, r.note].some((v) => String(v == null ? '' : v).toLowerCase().includes(needle));
    });
  }
  // 月ごとに集計(月・日付・作成日時の降順)
  function groupByMonth(records) {
    const desc = (a, b) => (a < b ? 1 : a > b ? -1 : 0);
    const sorted = records.slice().sort((a, b) => desc(a.date, b.date) || desc(a.createdAt, b.createdAt));
    const groups = [];
    for (const r of sorted) {
      const month = r.date.slice(0, 7);
      let g = groups[groups.length - 1];
      if (!g || g.month !== month) { g = { month, total: 0, records: [] }; groups.push(g); }
      g.records.push(r);
      g.total += typeof r.cost === 'number' ? r.cost : 0;
    }
    return groups;
  }

  return {
    SETTINGS_VERSION, TABS, DEFAULT_SETTINGS, DISPLAY_ONLY_KEYS,
    mergeSettings, detectLang, loadStored, parseQuery, stepZoom, zoomOptions, effectiveTheme,
    CATEGORIES, KINDS, LIMITS, isDate,
    validateEquipment, validateRecord, normalizeEquipment, normalizeRecord, normalizePhotoMeta,
    toDateStr, addMonths, diffDays, activeDues, dueStatus, listDues, equipmentBadge, cascadeDelete,
    filterEquipment, sortEquipment, filterRecords, groupByMonth,
    PHOTO, fitSize,
    I18N, t,
  };
})();

<script id="app-ui">
const App = (() => {
  const STORAGE_KEY = 'mmnote';
  const IDLE_MS = 10000;

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));
  const tr = (key, params) => Logic.t(state.settings.lang, key, params);

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // ---- 状態 ----
  const state = {
    settings: { ...Logic.DEFAULT_SETTINGS },
    equipment: [],
    records: [],
    tab: 'equipment',
    view: { name: 'list' },
    db: 'loading', // loading / ok / error(開けない)/ closed(別のタブが接続を切らせた)
    equipmentFilter: { q: '', category: '', sort: 'name' },
  };
  let lastStatus = { level: 'ok', key: null, params: null };
  let idleTimer = null;
  const today = () => Logic.toDateStr(new Date());

  // ---- DB ----
  const DB_NAME = 'mmnote';
  const DB_VERSION = 1;
  const newId = () => crypto.randomUUID();

  const DB = (() => {
    let db = null;
    const request = (req) => new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });

    function open() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const d = req.result;
          d.createObjectStore('equipment', { keyPath: 'id' });
          d.createObjectStore('records', { keyPath: 'id' }).createIndex('equipmentId', 'equipmentId');
          d.createObjectStore('photos', { keyPath: 'id' }).createIndex('ownerId', 'ownerId');
          d.createObjectStore('thumbs', { keyPath: 'id' });
        };
        req.onsuccess = () => {
          db = req.result;
          // 別のタブが削除・更新しようとしたら、こちらは手を放して再読込を促す
          db.onversionchange = () => { db.close(); db = null; handleDbClosed(); };
          resolve();
        };
        req.onerror = () => reject(req.error);
      });
    }

    // 1 つの読み書きトランザクションで fn を実行し、完了で resolve
    function write(stores, fn) {
      return new Promise((resolve, reject) => {
        if (!db) { reject('err_db_closed'); return; }
        let tx;
        try { tx = db.transaction(stores, 'readwrite'); } catch { reject('err_db_closed'); return; }
        tx.oncomplete = () => resolve();
        tx.onabort = () => reject(tx.error || new Error('aborted'));
        try { fn(tx); } catch (err) { try { tx.abort(); } catch { /* 既に終わっている */ } reject(err); }
      });
    }

    function writePhotos(tx, addPhotos, removePhotoIds) {
      const photos = tx.objectStore('photos'), thumbs = tx.objectStore('thumbs');
      for (const { meta, blob, thumb } of addPhotos) {
        photos.put({ ...meta, blob });
        thumbs.put({ id: meta.id, blob: thumb });
      }
      for (const id of removePhotoIds) { photos.delete(id); thumbs.delete(id); }
    }

    async function loadAll() {
      if (!db) throw 'err_db_closed';
      const tx = db.transaction(['equipment', 'records'], 'readonly');
      const [eq, rec] = await Promise.all([request(tx.objectStore('equipment').getAll()), request(tx.objectStore('records').getAll())]);
      return {
        equipment: eq.map((x) => Logic.normalizeEquipment(x)).filter(Boolean),
        records: rec.map((x) => Logic.normalizeRecord(x)).filter(Boolean),
      };
    }

    const saveEquipment = (equipment, addPhotos, removePhotoIds) => write(['equipment', 'photos', 'thumbs'], (tx) => {
      tx.objectStore('equipment').put(equipment);
      writePhotos(tx, addPhotos, removePhotoIds);
    });
    const saveRecord = (record, addPhotos, removePhotoIds) => write(['records', 'photos', 'thumbs'], (tx) => {
      tx.objectStore('records').put(record);
      writePhotos(tx, addPhotos, removePhotoIds);
    });
    const deleteEquipment = (id, recordIds, photoIds) => write(['equipment', 'records', 'photos', 'thumbs'], (tx) => {
      tx.objectStore('equipment').delete(id);
      for (const r of recordIds) tx.objectStore('records').delete(r);
      writePhotos(tx, [], photoIds);
    });
    const deleteRecord = (id, photoIds) => write(['records', 'photos', 'thumbs'], (tx) => {
      tx.objectStore('records').delete(id);
      writePhotos(tx, [], photoIds);
    });

    // 読み取り専用で 1 ストアを読む
    function read(store, fn) {
      if (!db) return Promise.reject('err_db_closed');
      let tx;
      try { tx = db.transaction(store, 'readonly'); } catch { return Promise.reject('err_db_closed'); }
      return request(fn(tx.objectStore(store)));
    }
    const withMeta = (rec) => {
      const meta = rec && Logic.normalizePhotoMeta(rec);
      return meta && rec.blob instanceof Blob ? { meta, blob: rec.blob } : null;
    };
    const getThumb = async (id) => {
      const rec = await read('thumbs', (s) => s.get(id));
      return rec && rec.blob instanceof Blob ? rec.blob : null;
    };
    const getPhoto = async (id) => withMeta(await read('photos', (s) => s.get(id)));
    const allPhotos = async () => (await read('photos', (s) => s.getAll())).map(withMeta).filter(Boolean);

    return { open, loadAll, saveEquipment, saveRecord, deleteEquipment, deleteRecord, getThumb, getPhoto, allPhotos };
  })();

  async function startDb() {
    const persisted = navigator.storage?.persist?.();
    if (persisted) persisted.catch(() => {});
    try {
      await DB.open();
      const data = await DB.loadAll();
      state.equipment = data.equipment;
      state.records = data.records;
      state.db = 'ok';
    } catch {
      state.db = 'error';
      setStatus('error', 'err_db_unavailable');
    }
    render();
  }

  function handleDbClosed() {
    state.db = 'closed';
    setStatus('warn', 'db_version_change');
    render();
  }

  // ---- 設定 ----
  function readStored() {
    try { return localStorage.getItem(STORAGE_KEY); } catch { return null; }
  }

  function writeStored() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: Logic.SETTINGS_VERSION, settings: state.settings }));
      return true;
    } catch { return false; }
  }

  function saveSettings(patch) {
    state.settings = Logic.mergeSettings(state.settings, patch);
    if (writeStored()) setStatus('ok', 'status_settings_saved');
    else setStatus('warn', 'status_storage_unavailable');
    applySettings();
    render();
  }

  function applyI18n() {
    document.documentElement.lang = state.settings.lang;
    document.title = tr('app_title');
    for (const e of $$('[data-i18n]')) e.textContent = tr(e.dataset.i18n);
    for (const e of $$('[data-i18n-label]')) e.setAttribute('aria-label', tr(e.dataset.i18nLabel));
    for (const e of $$('[data-i18n-placeholder]')) e.placeholder = tr(e.dataset.i18nPlaceholder);
  }

  function applyTheme() {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = Logic.effectiveTheme(state.settings.theme, prefersDark);
    document.documentElement.dataset.theme = theme;
    // アイコンは切り替え先を表す(ライト表示中は月)
    $('#btn-theme use').setAttribute('href', theme === 'dark' ? '#icon-light-mode' : '#icon-dark-mode');
    $('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  }

  function applyZoom() {
    const zoom = state.settings.zoom;
    document.documentElement.style.setProperty('--zoom', String(zoom / 100));
    $('#btn-zoom-in').disabled = Logic.stepZoom(zoom, 1) === zoom;
    $('#btn-zoom-out').disabled = Logic.stepZoom(zoom, -1) === zoom;
  }

  function applySettings() {
    applyI18n();
    applyTheme();
    applyZoom();
    for (const e of $$('[data-setting]')) e.value = String(state.settings[e.dataset.setting]);
    showStatus();
  }

  // ---- 共通部品(シート、ステータス、確認) ----
  function setStatus(level, key, params) {
    lastStatus = { level, key, params: params || null };
    showStatus();
  }

  function showStatus() {
    $('#status-counts').textContent = tr('status_counts', { equipment: state.equipment.length, records: state.records.length });
    const msg = $('#status-message');
    msg.dataset.level = lastStatus.level;
    msg.textContent = lastStatus.key ? tr(lastStatus.key, lastStatus.params) : '';
    $('#status-dot').dataset.level = lastStatus.level;
  }

  let sheet = null; // 開いているシートの { validate, onOk, busy }

  // 入力のたびに validate を呼び、エラーのあいだは OK を無効にする
  function checkSheet() {
    if (!sheet) return;
    const errKey = sheet.validate ? sheet.validate() : null;
    $('#sheet-error').textContent = errKey ? tr(errKey) : '';
    $('#sheet-ok').disabled = !!errKey || sheet.busy;
    return !errKey;
  }

  function errorText(err) {
    if (typeof err === 'string') return tr(err);
    if (err && err.key) return tr(err.key, err.params);
    return tr('err_save_failed', { reason: (err && err.message) || String(err) });
  }

  function openSheet({ title, build, validate = null, onOk, onClose = null }) {
    const dlg = $('#sheet');
    const body = $('#sheet-body');
    $('#sheet-title').textContent = title;
    body.replaceChildren();
    sheet = { validate, onOk, onClose, busy: false };
    build(body);
    checkSheet();
    dlg.showModal();
    // 日付欄に自動でフォーカスすると iOS でピッカーが開くので、見出しへ移す
    $('#sheet-title').focus();
  }

  async function submitSheet() {
    if (!sheet || sheet.busy || !checkSheet()) return;
    const current = sheet;
    current.busy = true;
    checkSheet();
    try {
      if (current.onOk) await current.onOk();
      current.busy = false;
      closeSheet();
    } catch (err) {
      current.busy = false;
      checkSheet();
      $('#sheet-error').textContent = errorText(err);
    }
  }

  function closeSheet() {
    // 閉じるときの後始末(選んだ写真の URL を手放すなど)
    if (sheet && sheet.onClose) sheet.onClose();
    sheet = null;
    if ($('#sheet').open) $('#sheet').close();
    render();
  }

  function bindSheet() {
    $('#sheet-form').addEventListener('submit', (ev) => { ev.preventDefault(); submitSheet(); });
    $('#sheet-body').addEventListener('input', checkSheet);
    $('#sheet-body').addEventListener('change', checkSheet);
    $('#sheet-cancel').addEventListener('click', () => { if (!sheet || !sheet.busy) closeSheet(); });
    // Esc で閉じるときも同じ後始末をする(保存中は閉じない)
    $('#sheet').addEventListener('cancel', (ev) => {
      ev.preventDefault();
      if (!sheet || !sheet.busy) closeSheet();
    });
  }

  let confirmResolve = null;

  function confirmDialog(messageKey, params) {
    $('#confirm-message').textContent = tr(messageKey, params);
    $('#confirm').showModal();
    return new Promise((resolve) => { confirmResolve = resolve; });
  }

  function finishConfirm(result) {
    const resolve = confirmResolve;
    confirmResolve = null;
    if ($('#confirm').open) $('#confirm').close();
    if (resolve) resolve(result);
  }

  function bindConfirm() {
    $('#confirm-ok').addEventListener('click', () => finishConfirm(true));
    $('#confirm-cancel').addEventListener('click', () => finishConfirm(false));
    $('#confirm').addEventListener('cancel', (ev) => { ev.preventDefault(); finishConfirm(false); });
  }

  // シートの外で起きた失敗をステータス帯に出す
  function statusError(fallbackKey, err) {
    if (typeof err === 'string') setStatus('error', err);
    else if (err && err.key) setStatus('error', err.key, err.params);
    else setStatus('error', fallbackKey, { reason: (err && err.message) || String(err) });
  }

  function icon(id) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('aria-hidden', 'true');
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', `#${id}`);
    svg.append(use);
    return svg;
  }

  function iconButton(iconId, labelKey, onClick) {
    const b = el('button', 'icon-btn');
    b.type = 'button';
    b.setAttribute('aria-label', tr(labelKey));
    b.append(icon(iconId));
    b.addEventListener('click', onClick);
    return b;
  }

  function section(headingKey) {
    const s = el('section', 'detail-section');
    s.append(el('h3', null, tr(headingKey)));
    return s;
  }

  // ---- 写真 ----
  const Photos = (() => {
    // 長辺を max に収めて JPEG にする(透過は白で埋める)
    function encode(bmp, max, quality) {
      const size = Logic.fitSize(bmp.width, bmp.height, max);
      if (!size) return Promise.reject('photo_unreadable');
      const canvas = document.createElement('canvas');
      canvas.width = size.width;
      canvas.height = size.height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, size.width, size.height);
      ctx.drawImage(bmp, 0, 0, size.width, size.height);
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => (blob ? resolve({ blob, ...size }) : reject('photo_unreadable')), 'image/jpeg', quality);
      });
    }

    async function prepare(file) {
      let bmp;
      try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch { throw 'photo_unreadable'; }
      try {
        const full = await encode(bmp, Logic.PHOTO.max, Logic.PHOTO.quality);
        const thumb = await encode(bmp, Logic.PHOTO.thumbMax, Logic.PHOTO.thumbQuality);
        return { blob: full.blob, thumb: thumb.blob, width: full.width, height: full.height };
      } finally {
        bmp.close();
      }
    }

    return { prepare };
  })();

  // 保存済みサムネイルの URL を写真 id ごとに持つ(写真を消したら手放す)
  const thumbUrls = new Map();
  function thumbUrl(id) {
    if (!thumbUrls.has(id)) {
      thumbUrls.set(id, DB.getThumb(id).then((b) => b && URL.createObjectURL(b), () => null).then((u) => {
        if (!u) thumbUrls.delete(id);
        return u;
      }));
    }
    return thumbUrls.get(id);
  }
  function forgetThumbs(ids) {
    for (const id of ids) {
      const p = thumbUrls.get(id);
      if (!p) continue;
      thumbUrls.delete(id);
      p.then((u) => { if (u) URL.revokeObjectURL(u); });
    }
  }

  // 選んだ写真に id と属性を付け、持ち主の新しい photoIds と一緒に返す
  function attachPhotos(owner, ownerType, picked, removedIds, now) {
    const gone = new Set(removedIds);
    const addPhotos = picked.map((p) => ({
      meta: { id: newId(), ownerType, ownerId: owner.id, width: p.width, height: p.height, createdAt: now },
      blob: p.blob,
      thumb: p.thumb,
    }));
    const photoIds = [...owner.photoIds.filter((id) => !gone.has(id)), ...addPhotos.map((p) => p.meta.id)];
    return { photoIds, addPhotos };
  }

  // 写真欄(シートと詳細で共用。持ち主の種類は問わない)。選んだ写真は呼び出し側が保存するまでメモリに持つ。
  // onChange: 選択・取り外し・読み込みの開始と終了のたび / onOpen(id): 保存済みの写真をタップ / removable: × を出すか
  function photoPicker(container, { existingIds = [], limit = Logic.LIMITS.photos, onChange = null, onOpen = null, removable = true } = {}) {
    const removed = new Set();
    const added = []; // { blob, thumb, width, height, url }
    let busy = false;
    let disposed = false;
    let notice = null; // 直近の選択で出した案内 { key, params }

    const strip = el('div', 'photo-strip');
    const note = el('p', 'photo-note');
    note.hidden = true;
    const input = el('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.multiple = true;
    input.hidden = true;
    const addBtn = el('button', 'photo-tile photo-add');
    addBtn.type = 'button';
    addBtn.setAttribute('aria-label', tr('photo_add'));
    addBtn.append(icon('icon-add-photo'));
    addBtn.addEventListener('click', () => input.click());
    container.append(strip, note, input);

    const count = () => existingIds.filter((id) => !removed.has(id)).length + added.length;

    function tile(fill, onRemove, onTap) {
      const t = el('div', 'photo-tile');
      const img = el('img');
      img.alt = '';
      fill(img);
      if (onTap) {
        const open = el('button', 'photo-open');
        open.type = 'button';
        open.setAttribute('aria-label', tr('photo_open'));
        open.append(img);
        open.addEventListener('click', onTap);
        t.append(open);
      } else {
        t.append(img);
      }
      if (onRemove) {
        const x = el('button', 'photo-remove');
        x.type = 'button';
        x.setAttribute('aria-label', tr('photo_remove'));
        x.append(icon('icon-close'));
        x.addEventListener('click', onRemove);
        t.append(x);
      }
      return t;
    }

    function draw() {
      const tiles = [];
      for (const id of existingIds) {
        if (removed.has(id)) continue;
        tiles.push(tile(
          (img) => { thumbUrl(id).then((u) => { if (u) img.src = u; }); },
          removable ? () => { removed.add(id); changed(); } : null,
          onOpen ? () => onOpen(id) : null,
        ));
      }
      for (const p of added) {
        tiles.push(tile((img) => { img.src = p.url; }, () => {
          URL.revokeObjectURL(p.url);
          added.splice(added.indexOf(p), 1);
          changed();
        }, null));
      }
      addBtn.disabled = busy || count() >= limit;
      strip.replaceChildren(...tiles, addBtn);
    }
    function changed() {
      draw();
      if (onChange) onChange();
    }

    input.addEventListener('change', async () => {
      const files = Array.from(input.files || []);
      input.value = '';
      if (!files.length || busy) return;
      const room = Math.max(0, limit - count());
      const messages = [];
      notice = null;
      const warn = (key, params) => { notice = { key, params }; messages.push(tr(key, params)); setStatus('warn', key, params); };
      if (files.length > room) warn('photo_limit', { max: limit });
      busy = true;
      changed();
      let skipped = 0;
      for (const f of files.slice(0, room)) {
        try {
          const p = await Photos.prepare(f);
          if (disposed) return;
          added.push({ ...p, url: URL.createObjectURL(p.thumb) });
        } catch {
          skipped++;
        }
        if (disposed) return;
      }
      busy = false;
      if (skipped) warn('photo_skipped', { n: skipped });
      note.textContent = messages.join(' ');
      note.hidden = !messages.length;
      changed();
    });

    draw();
    return {
      added: () => added.map(({ blob, thumb, width, height }) => ({ blob, thumb, width, height })),
      removedIds: () => [...removed],
      busy: () => busy,
      notice: () => notice,
      // 選んだ写真の URL を手放す(保存しなかった写真はここで捨てる)
      dispose() {
        disposed = true;
        for (const p of added) URL.revokeObjectURL(p.url);
        added.length = 0;
      },
    };
  }

  // 保存できたことを知らせる。写真欄の案内(読めなかった枚数など)があればそちらを残す
  function savedStatus(picker) {
    const n = picker.notice();
    if (n) setStatus('warn', n.key, n.params);
    else setStatus('ok', 'saved');
  }

  // 写真の拡大表示。onDelete / onMakeCover は Promise を返す。渡さなければそのボタンを出さない
  let viewer = null;
  async function openPhotoViewer(photoId, { onDelete = null, onMakeCover = null } = {}) {
    closeViewer();
    const v = { url: null, onDelete, onMakeCover, busy: false };
    viewer = v;
    $('#viewer-message').textContent = '';
    $('#viewer-cover').hidden = !onMakeCover;
    $('#viewer-delete').hidden = !onDelete;
    setViewerBusy(false);
    $('#viewer').showModal();
    $('#viewer-close').focus();
    let photo = null;
    try { photo = await DB.getPhoto(photoId); } catch { /* 下で案内する */ }
    if (viewer !== v) return;
    if (!photo) {
      $('#viewer-message').textContent = tr('photo_missing');
      return;
    }
    v.url = URL.createObjectURL(photo.blob);
    const img = el('img');
    img.alt = '';
    img.src = v.url;
    $('#viewer-stage').append(img);
  }

  function closeViewer() {
    const v = viewer;
    viewer = null;
    if (v && v.url) URL.revokeObjectURL(v.url);
    $('#viewer-stage').replaceChildren($('#viewer-message'));
    if ($('#viewer').open) $('#viewer').close();
  }

  function setViewerBusy(busy) {
    for (const id of ['#viewer-cover', '#viewer-delete']) $(id).disabled = busy;
  }

  async function viewerAction(kind) {
    const v = viewer;
    if (!v || v.busy) return;
    if (kind === 'delete' && !(await confirmDialog('confirm_delete_photo'))) return;
    if (viewer !== v) return;
    v.busy = true;
    setViewerBusy(true);
    try {
      await (kind === 'delete' ? v.onDelete() : v.onMakeCover());
      if (viewer === v) closeViewer();
    } catch (err) {
      const fallback = kind === 'delete' ? 'err_delete_failed' : 'err_save_failed';
      statusError(fallback, err);
      if (viewer === v) $('#viewer-message').textContent = lastStatus.key ? tr(lastStatus.key, lastStatus.params) : '';
    } finally {
      v.busy = false;
      if (viewer === v) setViewerBusy(false);
    }
  }

  function bindViewer() {
    $('#viewer-close').addEventListener('click', closeViewer);
    $('#viewer-cover').addEventListener('click', () => viewerAction('cover'));
    $('#viewer-delete').addEventListener('click', () => viewerAction('delete'));
    $('#viewer').addEventListener('cancel', (ev) => {
      ev.preventDefault();
      if (!viewer || !viewer.busy) closeViewer();
    });
  }

  // ---- 機器タブ ----
  const CATEGORY_ICONS = { vehicle: 'icon-car', machine: 'icon-build', facility: 'icon-business', other: 'icon-category' };
  const dbReady = () => state.db === 'ok' || state.db === 'closed';
  const equipmentPane = () => $('.tab-pane[data-tab="equipment"]');
  let listScrollTop = 0;
  let detailPicker = null; // 詳細に出している写真欄

  function renderEquipment() {
    let current = null;
    if (state.view.name === 'equipment') {
      current = state.equipment.find((e) => e.id === state.view.id) || null;
      if (!current) state.view = { name: 'list' };
    }
    $('#equipment-list-view').hidden = !!current;
    $('#equipment-detail').hidden = !current;
    $('#btn-add-equipment').hidden = state.tab !== 'equipment' || !!current || !dbReady();
    if (detailPicker) { detailPicker.dispose(); detailPicker = null; }
    if (current) renderEquipmentDetail(current);
    else renderEquipmentList();
  }

  function renderEquipmentList() {
    const f = state.equipmentFilter;
    const total = state.equipment.length;
    $('#equipment-tools').hidden = !dbReady() || total === 0;
    const dues = f.sort === 'due' ? Logic.listDues(state.records, state.equipment, today(), state.settings.dueSoonDays) : [];
    const items = Logic.sortEquipment(Logic.filterEquipment(state.equipment, f), f.sort, dues);
    const empty = $('#equipment-empty');
    // サンプルデータへの導線は 0 件の案内の後ろに足す
    empty.textContent = !dbReady() ? '' : total === 0 ? tr('empty_equipment') : items.length === 0 ? tr('empty_filtered') : '';
    empty.hidden = !empty.textContent;
    $('#equipment-list').replaceChildren(...(dbReady() ? items.map(equipmentRow) : []));
  }

  function equipmentRow(e) {
    const li = el('li');
    const btn = el('button', 'row-item');
    btn.type = 'button';
    // 表紙: photoIds の先頭のサムネイル。読めるまでは種別のアイコン
    const cover = el('span', 'cover');
    cover.append(icon(CATEGORY_ICONS[e.category]));
    if (e.photoIds.length) {
      thumbUrl(e.photoIds[0]).then((u) => {
        if (!u) return;
        const img = el('img');
        img.alt = '';
        img.src = u;
        cover.replaceChildren(img);
      });
    }
    const text = el('span', 'row-text');
    text.append(el('span', 'row-title', e.name));
    const sub = [e.maker, e.model].filter(Boolean).join(' / ');
    if (sub) text.append(el('span', 'row-sub', sub));
    // 予定のバッジは text の後ろに足す
    btn.append(cover, text);
    btn.addEventListener('click', () => showEquipment(e.id));
    li.append(btn);
    return li;
  }

  function showEquipment(id) {
    if (!state.equipment.some((e) => e.id === id)) return;
    if (state.view.name === 'list' && state.tab === 'equipment') listScrollTop = equipmentPane().scrollTop;
    history.pushState({ equipmentId: id }, '');
    state.tab = 'equipment';
    state.view = { name: 'equipment', id };
    render();
    equipmentPane().scrollTop = 0;
  }

  function showEquipmentList() {
    state.view = { name: 'list' };
    render();
    equipmentPane().scrollTop = listScrollTop;
  }

  // 詳細を開いたときに積んだ履歴があれば戻る(popstate で一覧へ)
  function backToList() {
    if (history.state && history.state.equipmentId) history.back();
    else showEquipmentList();
  }

  function onPopState(ev) {
    const id = ev.state && ev.state.equipmentId;
    if (id && state.equipment.some((e) => e.id === id)) {
      state.tab = 'equipment';
      state.view = { name: 'equipment', id };
      render();
    } else {
      showEquipmentList();
    }
  }

  function renderEquipmentDetail(e) {
    const head = el('div', 'detail-head');
    head.append(
      iconButton('icon-arrow-back', 'back', backToList),
      el('h2', null, e.name),
      iconButton('icon-edit', 'edit', () => openEquipmentSheet(e)),
      iconButton('icon-delete', 'delete', () => deleteEquipmentFlow(e)),
    );
    const parts = [head];

    const photos = section('heading_photos');
    const picker = photoPicker(photos, {
      existingIds: e.photoIds,
      removable: false,
      onOpen: (photoId) => openEquipmentPhoto(e.id, photoId),
      onChange: () => addDetailPhotos(e.id, picker),
    });
    detailPicker = picker;
    parts.push(photos);

    const info = section('heading_info');
    const dl = el('dl', 'kv');
    const rows = [
      ['field_category', tr(`cat_${e.category}`)],
      ['field_maker', e.maker],
      ['field_model', e.model],
      ['field_serial', e.serial],
      ['field_acquired_on', e.acquiredOn],
    ];
    for (const [key, value] of rows) {
      if (!value) continue;
      dl.append(el('dt', null, tr(key)), el('dd', null, value));
    }
    info.append(dl);
    parts.push(info);

    // 次回予定はこの見出しの下に入れる
    parts.push(section('heading_dues'));

    if (e.specs.length) {
      const specs = section('heading_specs');
      const sdl = el('dl', 'kv');
      for (const s of e.specs) sdl.append(el('dt', null, s.label), el('dd', null, s.value));
      specs.append(sdl);
      parts.push(specs);
    }

    if (e.note) {
      const note = section('heading_note');
      note.append(el('p', 'note-text', e.note));
      parts.push(note);
    }

    // 記録の履歴はこの見出しの下に入れる
    parts.push(section('heading_records'));

    $('#equipment-detail').replaceChildren(...parts);
  }

  // 詳細の写真欄で選んだ写真は、読み終えたらすぐ保存する
  async function addDetailPhotos(equipmentId, picker) {
    if (picker.busy() || !picker.added().length) return;
    const e = state.equipment.find((x) => x.id === equipmentId);
    if (!e) return;
    const now = new Date().toISOString();
    const { photoIds, addPhotos } = attachPhotos(e, 'equipment', picker.added(), [], now);
    const item = { ...e, photoIds, updatedAt: now };
    try {
      await DB.saveEquipment(item, addPhotos, []);
      state.equipment = state.equipment.map((x) => (x.id === item.id ? item : x));
      savedStatus(picker);
    } catch (err) {
      statusError('err_save_failed', err);
    }
    render();
  }

  // 機器の photoIds を並べ替え・削除して保存する
  async function updateEquipmentPhotos(equipmentId, nextIds, removeIds) {
    const e = state.equipment.find((x) => x.id === equipmentId);
    if (!e) return;
    const item = { ...e, photoIds: nextIds(e.photoIds), updatedAt: new Date().toISOString() };
    await DB.saveEquipment(item, [], removeIds);
    forgetThumbs(removeIds);
    state.equipment = state.equipment.map((x) => (x.id === item.id ? item : x));
    render();
  }

  function openEquipmentPhoto(equipmentId, photoId) {
    const e = state.equipment.find((x) => x.id === equipmentId);
    if (!e) return;
    openPhotoViewer(photoId, {
      onDelete: async () => {
        await updateEquipmentPhotos(equipmentId, (ids) => ids.filter((x) => x !== photoId), [photoId]);
        setStatus('ok', 'deleted');
      },
      // 表紙にする = photoIds の先頭へ(すでに表紙なら出さない)
      onMakeCover: e.photoIds[0] === photoId ? null : async () => {
        await updateEquipmentPhotos(equipmentId, (ids) => [photoId, ...ids.filter((x) => x !== photoId)], []);
        setStatus('ok', 'saved');
      },
    });
  }

  async function deleteEquipmentFlow(e) {
    const { recordIds, photoIds } = Logic.cascadeDelete(e.id, state.equipment, state.records);
    if (!(await confirmDialog('confirm_delete_equipment', { name: e.name, records: recordIds.length }))) return;
    try {
      await DB.deleteEquipment(e.id, recordIds, photoIds);
    } catch (err) {
      statusError('err_delete_failed', err);
      return;
    }
    const gone = new Set(recordIds);
    forgetThumbs(photoIds);
    state.equipment = state.equipment.filter((x) => x.id !== e.id);
    state.records = state.records.filter((r) => !gone.has(r.id));
    setStatus('ok', 'deleted');
    backToList();
  }

  function formRow(labelKey, input) {
    const wrap = el('div', 'form-row');
    input.id = `f-${labelKey}`;
    const label = el('label', null, tr(labelKey));
    label.htmlFor = input.id;
    wrap.append(label, input);
    return wrap;
  }

  function textInput(value) {
    const i = el('input');
    i.type = 'text';
    i.autocomplete = 'off';
    i.value = value || '';
    return i;
  }

  // 機器の入力欄を作り、今の入力を読む関数を返す
  function buildEquipmentForm(body, src) {
    const name = textInput(src.name);
    const category = el('select');
    for (const c of Logic.CATEGORIES) {
      const o = el('option', null, tr(`cat_${c}`));
      o.value = c;
      category.append(o);
    }
    category.value = src.category;
    const maker = textInput(src.maker);
    const model = textInput(src.model);
    const serial = textInput(src.serial);
    const acquiredOn = el('input');
    acquiredOn.type = 'date';
    acquiredOn.value = src.acquiredOn || '';

    // 仕様: 行の追加と削除。上限に達したら追加ボタンを無効にする
    const specsBox = el('div', 'form-row');
    const specsLabel = el('span', 'form-label', tr('field_specs'));
    const specRows = el('div');
    const addSpec = el('button', 'btn btn-icon-text');
    addSpec.type = 'button';
    addSpec.append(icon('icon-add'), el('span', null, tr('add_spec')));
    const refreshSpecs = () => { addSpec.disabled = specRows.children.length >= Logic.LIMITS.specs; };
    const specRow = (s) => {
      const row = el('div', 'spec-row');
      const label = textInput(s.label);
      label.placeholder = tr('spec_label');
      label.setAttribute('aria-label', tr('spec_label'));
      const value = textInput(s.value);
      value.placeholder = tr('spec_value');
      value.setAttribute('aria-label', tr('spec_value'));
      const remove = iconButton('icon-close', 'remove_spec', () => { row.remove(); refreshSpecs(); checkSheet(); });
      row.append(label, value, remove);
      return row;
    };
    for (const s of src.specs) specRows.append(specRow(s));
    addSpec.addEventListener('click', () => {
      if (specRows.children.length >= Logic.LIMITS.specs) return;
      const row = specRow({ label: '', value: '' });
      specRows.append(row);
      row.querySelector('input').focus();
      refreshSpecs();
      checkSheet();
    });
    refreshSpecs();
    specsBox.append(specsLabel, specRows, addSpec);

    const note = el('textarea');
    note.rows = 3;
    note.value = src.note || '';

    body.append(
      formRow('field_name', name),
      formRow('field_category', category),
      formRow('field_maker', maker),
      formRow('field_model', model),
      formRow('field_serial', serial),
      formRow('field_acquired_on', acquiredOn),
      specsBox,
      formRow('field_note', note),
    );

    return () => ({
      name: name.value,
      category: category.value,
      maker: maker.value.trim(),
      model: model.value.trim(),
      serial: serial.value.trim(),
      acquiredOn: acquiredOn.value || null,
      specs: Array.from(specRows.children, (row) => {
        const [l, v] = row.querySelectorAll('input');
        return { label: l.value.trim(), value: v.value.trim() };
      }),
      note: note.value,
    });
  }

  function openEquipmentSheet(existing) {
    const src = existing || { name: '', category: 'other', maker: '', model: '', serial: '', acquiredOn: null, specs: [], note: '', photoIds: [] };
    let read = null;
    let picker = null;
    openSheet({
      title: tr(existing ? 'sheet_edit_equipment' : 'sheet_add_equipment'),
      build: (body) => {
        // 写真は先頭に置く(機器の前で撮ってから書けるように)
        const row = el('div', 'form-row');
        row.append(el('span', 'form-label', tr('heading_photos')));
        picker = photoPicker(row, { existingIds: src.photoIds, onChange: checkSheet });
        body.append(row);
        read = buildEquipmentForm(body, src);
      },
      validate: () => (picker.busy() ? 'photo_processing' : Logic.validateEquipment(read())[0] || null),
      onOk: async () => {
        const now = new Date().toISOString();
        const id = existing ? existing.id : newId();
        const removed = picker.removedIds();
        const { photoIds, addPhotos } = attachPhotos({ id, photoIds: src.photoIds }, 'equipment', picker.added(), removed, now);
        const item = Logic.normalizeEquipment({
          ...read(),
          id,
          photoIds,
          createdAt: (existing && existing.createdAt) || now,
          updatedAt: now,
        });
        await DB.saveEquipment(item, addPhotos, removed);
        forgetThumbs(removed);
        state.equipment = existing ? state.equipment.map((x) => (x.id === item.id ? item : x)) : [...state.equipment, item];
        savedStatus(picker);
      },
      onClose: () => picker.dispose(),
    });
  }

  function bindEquipment() {
    $('#eq-search').addEventListener('input', (ev) => { state.equipmentFilter.q = ev.target.value; renderEquipment(); });
    $('#eq-category').addEventListener('change', (ev) => { state.equipmentFilter.category = ev.target.value; renderEquipment(); });
    $('#eq-sort').addEventListener('change', (ev) => { state.equipmentFilter.sort = ev.target.value; renderEquipment(); });
    $('#btn-add-equipment').addEventListener('click', () => openEquipmentSheet(null));
    window.addEventListener('popstate', onPopState);
  }

  // ---- 設定タブ ----
  function bindSettings() {
    const zoomSel = $('#set-zoom');
    for (const z of Logic.zoomOptions()) {
      const o = el('option', null, `${z}%`);
      o.value = String(z);
      zoomSel.append(o);
    }
    for (const e of $$('[data-setting]')) {
      e.addEventListener('change', () => {
        // 不正な値は mergeSettings が捨てるので、欄は今の設定に戻る
        saveSettings({ [e.dataset.setting]: e.value });
      });
    }
  }

  // ---- 描画とタブ ----
  function render() {
    if ($('#sheet').open) return;
    for (const b of $$('#tabbar .tab')) b.setAttribute('aria-selected', String(b.dataset.tab === state.tab));
    for (const p of $$('.tab-pane')) p.hidden = p.dataset.tab !== state.tab;
    renderDbMessage();
    renderEquipment();
    showStatus();
  }

  // DB が使えないときは main の先頭に理由を出す
  function renderDbMessage() {
    const box = $('#db-message');
    box.hidden = state.db !== 'error' && state.db !== 'closed';
    if (state.db === 'error') {
      box.replaceChildren(el('p', null, tr('err_db_unavailable')));
    } else if (state.db === 'closed') {
      const reload = el('button', 'btn', tr('reload'));
      reload.type = 'button';
      reload.addEventListener('click', () => location.reload());
      box.replaceChildren(el('p', null, tr('db_version_change')), reload);
    } else {
      box.replaceChildren();
    }
  }

  function switchTab(name) {
    if (!Logic.TABS.includes(name)) return;
    state.tab = name;
    render();
  }

  // ---- ツールバー ----
  function resetIdle() {
    $('#toolbar').classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => $('#toolbar').classList.add('idle'), IDLE_MS);
  }

  function bindToolbar() {
    // ヘルプはマニュアルへのリンクにする(後続のタスク)
    $('#btn-theme').addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      saveSettings({ theme: next });
    });
    $('#btn-zoom-in').addEventListener('click', () => saveSettings({ zoom: Logic.stepZoom(state.settings.zoom, 1) }));
    $('#btn-zoom-out').addEventListener('click', () => saveSettings({ zoom: Logic.stepZoom(state.settings.zoom, -1) }));
    $('#btn-lang').addEventListener('click', () => saveSettings({ lang: state.settings.lang === 'ja' ? 'en' : 'ja' }));
    for (const ev of ['pointermove', 'pointerdown', 'touchstart', 'keydown']) document.addEventListener(ev, resetIdle, { passive: true });
    resetIdle();
  }

  // ---- 起動 ----
  function init() {
    const query = Logic.parseQuery(location.search);
    state.settings = Logic.mergeSettings(Logic.loadStored(readStored(), navigator.language), query.settings);
    if (query.save && !writeStored()) setStatus('warn', 'status_storage_unavailable');
    if (query.tab) state.tab = query.tab;
    bindSettings();
    bindToolbar();
    bindSheet();
    bindConfirm();
    bindViewer();
    bindEquipment();
    for (const b of $$('#tabbar .tab')) b.addEventListener('click', () => switchTab(b.dataset.tab));
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
    // 再読込したら一覧から始める(前の詳細の履歴を持ち越さない)
    history.replaceState(null, '');
    applySettings();
    render();
    startDb();
  }

  document.addEventListener('DOMContentLoaded', init);

  return { state, render, switchTab, saveSettings, setStatus, openSheet, confirmDialog, showEquipment, openEquipmentSheet, photoPicker, openPhotoViewer };
})();
</script>
</body>
</html>
