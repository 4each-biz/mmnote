  // 記録の詳細で選んだ写真は、読み終えたらすぐ保存する(機器の updatedAt は変えない)
  async function addRecordDetailPhotos(recordId, picker) {
    if (picker.busy() || !picker.added().length) return;
    const r = state.records.find((x) => x.id === recordId);
    if (!r) return;
    const now = new Date().toISOString();
    const { photoIds, addPhotos } = attachPhotos(r, 'record', picker.added(), [], now);
    const item = { ...r, photoIds, updatedAt: now };
    try {
      await DB.saveRecord(item, addPhotos, []);
      replaceRecord(item);
      savedStatus(picker);
    } catch (err) {
      statusError('err_save_failed', err);
    }
    render();
  }

  async function removeRecordPhoto(recordId, photoId) {
    const r = state.records.find((x) => x.id === recordId);
    if (!r) return;
    const item = { ...r, photoIds: r.photoIds.filter((x) => x !== photoId), updatedAt: new Date().toISOString() };
    await DB.saveRecord(item, [], [photoId]);
    forgetThumbs([photoId]);
    replaceRecord(item);
    render();
  }

  async function deleteRecordFlow(id) {
    const r = state.records.find((x) => x.id === id);
    if (!r || !(await confirmDialog('confirm_delete_record', { title: r.title }))) return;
    // 確認のあいだに写真が足されていてもよいように、今の記録を読み直す
    const cur = state.records.find((x) => x.id === id);
    if (!cur) return;
    try {
      await DB.deleteRecord(cur.id, cur.photoIds);
    } catch (err) {
      statusError('err_delete_failed', err);
      return;
    }
    forgetThumbs(cur.photoIds);
    state.records = state.records.filter((x) => x.id !== id);
    setStatus('ok', 'deleted');
    backFromRecord();
  }

  // 数の欄: 全角と桁区切りのカンマは受け付ける。空は null、数として読めなければ NaN(検証でエラーになる)
  function parseNumber(s) {
    const v = s.normalize('NFKC').replace(/,/g, '').trim();
    if (v === '') return null;
    return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(v) ? Number(v) : NaN;
  }

  const QUICK_DUES = [[1, 'due_in_1m'], [3, 'due_in_3m'], [6, 'due_in_6m'], [12, 'due_in_1y']];

  // 記録の入力欄を作り、今の入力を読む関数を返す。choose なら機器を選ぶ欄、そうでなければ機器名を出すだけ
  function buildRecordForm(body, src, choose) {
    let equipment = null;
    if (choose) {
      equipment = el('select');
      const blank = el('option', null, '');
      blank.value = '';
      equipment.append(blank);
      for (const e of Logic.sortEquipment(state.equipment, 'name', [])) {
        const o = el('option', null, e.name);
        o.value = e.id;
        equipment.append(o);
      }
      // 記録タブで機器を絞り込んでいれば、その機器を選んでおく
      equipment.value = state.equipment.some((e) => e.id === state.recordFilter.equipmentId) ? state.recordFilter.equipmentId : '';
      body.append(formRow('field_equipment', equipment));
    } else {
      const row = el('div', 'form-row');
      row.append(el('span', 'form-label', tr('field_equipment')), el('p', 'fixed-value', equipmentName(src.equipmentId)));
      body.append(row);
    }

    const date = el('input');
    date.type = 'date';
    date.value = src.date;
    const kind = el('select');
    for (const k of Logic.KINDS) {
      const o = el('option', null, tr(`kind_${k}`));
      o.value = k;
      kind.append(o);
    }
    kind.value = src.kind;
    const title = textInput(src.title);
    const cost = textInput(src.cost === null ? '' : String(src.cost));
    cost.inputMode = 'numeric';
    const vendor = textInput(src.vendor);

    // 計器の値と単位は 1 行に並べる
    const meterRow = el('div', 'form-row');
    const meterValue = textInput(src.meterValue === null ? '' : String(src.meterValue));
    meterValue.inputMode = 'decimal';
    meterValue.id = 'f-field_meter';
    const meterLabel = el('label', null, tr('field_meter'));
    meterLabel.htmlFor = meterValue.id;
    const meterUnit = textInput(src.meterUnit);
    meterUnit.id = 'f-field_meter_unit';
    meterUnit.placeholder = tr('field_meter_unit');
    meterUnit.setAttribute('aria-label', tr('field_meter_unit'));
    const meterPair = el('div', 'meter-row');
    meterPair.append(meterValue, meterUnit);
    meterRow.append(meterLabel, meterPair);

    // 次回予定日: 実施日を起点に N か月後を埋めるボタン(実施日が正しくないあいだは押せない)
    const nextDue = el('input');
    nextDue.type = 'date';
    nextDue.value = src.nextDue || '';
    const dueRow = formRow('field_next_due', nextDue);
    const quick = el('div', 'quick-due');
    const quickButtons = QUICK_DUES.map(([n, key]) => {
      const b = el('button', 'btn', tr(key));
      b.type = 'button';
      b.addEventListener('click', () => {
        if (!Logic.isDate(date.value)) return;
        nextDue.value = Logic.addMonths(date.value, n);
        checkSheet();
      });
      return b;
    });
    const refreshQuick = () => { for (const b of quickButtons) b.disabled = !Logic.isDate(date.value); };
    date.addEventListener('input', refreshQuick);
    date.addEventListener('change', refreshQuick);
    refreshQuick();
    quick.append(...quickButtons);
    dueRow.append(quick);

    const note = el('textarea');
    note.rows = 3;
    note.value = src.note || '';

    body.append(
      formRow('field_date', date),
      formRow('field_kind', kind),
      formRow('field_title', title),
      formRow('field_cost', cost),
      formRow('field_vendor', vendor),
      meterRow,
      dueRow,
      formRow('field_note', note),
    );

    return () => ({
      equipmentId: equipment ? equipment.value : src.equipmentId,
      date: date.value,
      kind: kind.value,
      title: title.value,
      cost: parseNumber(cost.value),
      vendor: vendor.value.trim(),
      meterValue: parseNumber(meterValue.value),
      meterUnit: meterUnit.value.trim(),
      nextDue: nextDue.value || null,
      note: note.value,
    });
  }

  // record: 編集する記録(新規は null)。preset: 新規のときの { equipmentId, kind?, title? }。
  // 機器は、編集のときと equipmentId を指定して開いたときは固定、指定が無ければ選ぶ
  function openRecordSheet(existing, preset) {
    const p = preset || {};
    const src = existing || {
      equipmentId: p.equipmentId || '',
      date: today(),
      kind: Logic.KINDS.includes(p.kind) ? p.kind : 'inspection',
      title: p.title || '',
      cost: null, vendor: '', meterValue: null, meterUnit: '', nextDue: null, note: '', photoIds: [],
    };
    const choose = !existing && !p.equipmentId;
    let read = null;
    let picker = null;
    openSheet({
      title: tr(existing ? 'sheet_edit_record' : 'sheet_add_record'),
      build: (body) => {
        // 写真は先頭に置く(機器の前で撮ってから書けるように)
        const row = el('div', 'form-row');
        row.append(el('span', 'form-label', tr('heading_photos')));
        picker = photoPicker(row, { existingIds: src.photoIds, onChange: checkSheet });
        body.append(row);
        read = buildRecordForm(body, src, choose);
      },
      validate: () => {
        if (picker.busy()) return 'photo_processing';
        const v = read();
        if (!state.equipment.some((e) => e.id === v.equipmentId)) return 'err_equipment_required';
        return Logic.validateRecord(v)[0] || null;
      },
      onOk: async () => {
        const now = new Date().toISOString();
        const id = existing ? existing.id : newId();
        const removed = picker.removedIds();
        const { photoIds, addPhotos } = attachPhotos({ id, photoIds: src.photoIds }, 'record', picker.added(), removed, now);
        const item = Logic.normalizeRecord({
          ...read(),
          id,
          photoIds,
          createdAt: (existing && existing.createdAt) || now,
          updatedAt: now,
        });
        await DB.saveRecord(item, addPhotos, removed);
        forgetThumbs(removed);
        state.records = existing ? state.records.map((x) => (x.id === item.id ? item : x)) : [...state.records, item];
        savedStatus(picker);
      },
      onClose: () => picker.dispose(),
    });
  }

  function fillRecordFilters() {
    const f = state.recordFilter;
    const option = (value, text) => { const o = el('option', null, text); o.value = value; return o; };
    $('#rec-kind').replaceChildren(option('', tr('filter_all_kinds')), ...Logic.KINDS.map((k) => option(k, tr(`kind_${k}`))));
    $('#rec-kind').value = f.kind;
    $('#rec-equipment').replaceChildren(option('', tr('filter_all_equipment')),
      ...Logic.sortEquipment(state.equipment, 'name', []).map((e) => option(e.id, e.name)));
    $('#rec-equipment').value = f.equipmentId;
  }

  function renderRecords() {
    const f = state.recordFilter;
    // 絞り込みに選んでいた機器が無くなっていたら(削除・読み込み)、絞り込みを外す
    if (f.equipmentId && !state.equipment.some((e) => e.id === f.equipmentId)) f.equipmentId = '';
    if (state.recordsView.name === 'record' && !state.records.some((r) => r.id === state.recordsView.id)) state.recordsView = { name: 'list' };
    const inDetail = state.recordsView.name === 'record';
    $('#records-list-view').hidden = inDetail;
    $('#records-detail').hidden = !inDetail;
    const add = $('#btn-add-record');
    add.hidden = state.tab !== 'records' || inDetail || !dbReady();
    add.disabled = state.equipment.length === 0;
    if (recordsPicker) { recordsPicker.dispose(); recordsPicker = null; }
    if (inDetail) {
      recordsPicker = renderRecordDetail($('#records-detail'), state.records.find((r) => r.id === state.recordsView.id));
      return;
    }
    const total = state.records.length;
    $('#records-tools').hidden = !dbReady() || total === 0;
    fillRecordFilters();
    const groups = dbReady() ? Logic.groupByMonth(Logic.filterRecords(state.records, f)) : [];
    const empty = $('#records-empty');
    // 機器が 0 件のときは、追加ボタンを無効にした理由をここで案内する
    empty.textContent = !dbReady() ? ''
      : state.equipment.length === 0 ? tr('empty_records_need_equipment')
      : total === 0 ? tr('empty_records')
      : groups.length === 0 ? tr('empty_records_filtered') : '';
    empty.hidden = !empty.textContent;
    $('#records-list').replaceChildren(...groups.map((g) => {
      const wrap = el('section');
      const head = el('h3', 'month-head');
      const [y, m] = g.month.split('-');
      head.append(
        el('span', null, tr('month_heading', { y, m: Number(m) })),
        el('span', 'month-total', tr('month_total', { amount: money(g.total) })),
      );
      const ul = el('ul', 'row-list');
      ul.append(...g.records.map((r) => recordRow(r, true)));
      wrap.append(head, ul);
      return wrap;
    }));
  }

  function bindRecords() {
    $('#rec-search').addEventListener('input', (ev) => { state.recordFilter.q = ev.target.value; renderRecords(); });
    $('#rec-kind').addEventListener('change', (ev) => { state.recordFilter.kind = ev.target.value; renderRecords(); });
    $('#rec-equipment').addEventListener('change', (ev) => { state.recordFilter.equipmentId = ev.target.value; renderRecords(); });
    $('#btn-add-record').addEventListener('click', () => { if (state.equipment.length) openRecordSheet(null, null); });
  }

  function bindEquipment() {
    $('#eq-search').addEventListener('input', (ev) => { state.equipmentFilter.q = ev.target.value; renderEquipment(); });
    $('#eq-category').addEventListener('change', (ev) => { state.equipmentFilter.category = ev.target.value; renderEquipment(); });
    $('#eq-sort').addEventListener('change', (ev) => { state.equipmentFilter.sort = ev.target.value; renderEquipment(); });
    $('#btn-add-equipment').addEventListener('click', () => openEquipmentSheet(null));
    $('#btn-goto-sample').addEventListener('click', gotoSample);
    window.addEventListener('popstate', onPopState);
  }

  // ---- 予定タブ ----
  // 残り日数の文言(0 日は「今日」、過ぎたら超過日数)
  function daysText(d) {
    if (d.days === 0) return tr('due_today');
    if (d.days < 0) return d.days === -1 ? tr('due_over_day') : tr('due_over_days', { n: -d.days });
    return d.days === 1 ? tr('due_in_day') : tr('due_in_days', { n: d.days });
  }

  // 予定の 1 行。inDetail なら機器の詳細の中(機器名を省き、タップで元の記録へ)、そうでなければ予定タブ(タップで機器の詳細へ)
  function dueRow(d, inDetail) {
    const li = el('li', 'due-row');
    const btn = el('button', 'row-item');
    btn.type = 'button';
    const text = el('span', 'row-text');
    const kind = tr(`kind_${d.kind}`);
    if (inDetail) {
      text.append(el('span', 'row-title', `${d.nextDue} ${kind}`), el('span', 'row-sub', d.title));
    } else {
      text.append(el('span', 'row-title', d.equipmentName), el('span', 'row-sub', [d.nextDue, kind, d.title].join(' · ')));
    }
    const days = el('span', 'due-days', daysText(d));
    days.dataset.status = d.status;
    btn.append(text, days);
    btn.addEventListener('click', () => (inDetail ? showRecord(d.recordId) : showEquipment(d.equipmentId)));
    const done = el('button', 'btn', tr('record_done'));
    done.type = 'button';
    done.addEventListener('click', () => openRecordSheet(null, { equipmentId: d.equipmentId, kind: d.kind, title: d.title }));
    li.append(btn, done);
    return li;
  }

  function renderDues(dues) {
    const groups = dbReady() ? ['overdue', 'soon', 'later'].map((status) => ({ status, items: dues.filter((d) => d.status === status) }))
      .filter((g) => g.items.length) : [];
    const empty = $('#dues-empty');
    empty.textContent = dbReady() && !groups.length ? tr('empty_dues') : '';
    empty.hidden = !empty.textContent;
    $('#dues-list').replaceChildren(...groups.map((g) => {
      const wrap = el('section');
      const head = el('h3', 'month-head');
      head.append(el('span', null, tr(`dues_${g.status}`)), el('span', null, String(g.items.length)));
      const ul = el('ul', 'row-list');
      ul.append(...g.items.map((d) => dueRow(d, false)));
      wrap.append(head, ul);
      return wrap;
    }));
    // タブバーの「予定」に期限切れの件数(0 なら出さない)
    const overdue = dues.filter((d) => d.status === 'overdue').length;
    const count = $('#dues-count');
    count.textContent = overdue ? String(overdue) : '';
    count.hidden = !overdue;
  }

  // 日付が変わったら描き直す(1 分ごとと、表示に戻ったとき)
  let shownDay = null;
  function checkDay() {
    const d = today();
    if (d === shownDay) return;
    shownDay = d;
    render();
  }

  // ---- 設定タブ ----
  function bindSettings() {
    const zoomSel = $('#set-zoom');
    for (const z of Logic.zoomOptions()) {
      const o = el('option', null, `${z}%`);
      o.value = String(z);
      zoomSel.append(o);
    }
    for (const e of $$('[data-setting]')) {
      e.addEventListener('change', () => {
        // 不正な値は mergeSettings が捨てるので、欄は今の設定に戻る
        saveSettings({ [e.dataset.setting]: e.value });
      });
    }
    $('#btn-export').addEventListener('click', () => runData(exportData));
    $('#btn-import').addEventListener('click', () => $('#import-file').click());
    $('#import-file').addEventListener('change', (ev) => {
      const file = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      if (file) runData(() => importData(file));
    });
    $('#btn-erase').addEventListener('click', () => runData(eraseAll));
    $('#btn-sample').addEventListener('click', () => runData(loadSample));
    buildSupport();
    buildAbout();
  }

  // 別タブで開くリンク
  function externalLink(href, i18nKey, text) {
    const a = el('a', null, text);
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener';
    if (i18nKey) a.dataset.i18n = i18nKey;
    return a;
  }

  // サポートのリンク(文言は applyI18n が data-i18n から入れる)
  function buildSupport() {
    $('#support-links').replaceChildren(...Logic.SUPPORT.links.map((l) => {
      const li = el('li');
      li.append(externalLink(Logic.supportUrl(l.key), `support_${l.key}`));
      return li;
    }));
  }

  function buildAbout() {
    const A = Logic.ABOUT;
    const row = (key, value) => {
      const dt = el('dt');
      dt.dataset.i18n = key;
      const dd = el('dd');
      dd.append(value);
      return [dt, dd];
    };
    $('#about-list').replaceChildren(
      ...row('about_version', `${A.name} ${A.version}`),
      ...row('about_source', externalLink(A.repo, null, 'GitHub')),
      ...row('about_license', A.license),
      ...row('about_credits', A.credits.join(', ')),
    );
  }

  // 機器タブの 0 件の案内から、設定タブのサンプルのボタンへ
  function gotoSample() {
    switchTab('settings');
    const sec = $('.settings-section[data-section="data"]');
    sec.open = true;
    const btn = $('#btn-sample');
    btn.scrollIntoView({ block: 'center' });
    btn.focus({ preventScroll: true });
  }

  // ---- データ(エクスポート / インポート / 全消去) ----
  let dataBusy = false;
  async function runData(fn) {
    if (dataBusy || state.db !== 'ok') return;
    dataBusy = true;
    renderData();
    try { await fn(); } finally { dataBusy = false; renderData(); }
  }

  function renderData() {
    for (const id of ['#btn-export', '#btn-import', '#btn-erase']) $(id).disabled = dataBusy || state.db !== 'ok';
    $('#btn-sample').disabled = dataBusy || state.db !== 'ok' || !isEmpty();
  }
  const isEmpty = () => state.equipment.length === 0 && state.records.length === 0;

  function updateUsage() {
    const est = navigator.storage?.estimate?.();
    if (!est) return;
    est.then(({ usage }) => {
      if (typeof usage !== 'number') return;
      const p = $('#data-usage');
      p.textContent = tr('data_usage', { mb: (usage / 1048576).toFixed(1) });
      p.hidden = false;
    }, () => {});
  }

  // fflate の非同期 API を Promise にする
  const zipAsync = (files) => new Promise((resolve, reject) => fflate.zip(files, (err, out) => (err ? reject(err) : resolve(out))));
  const unzipAsync = (u8) => new Promise((resolve, reject) => fflate.unzip(u8, (err, out) => (err ? reject(err) : resolve(out))));

  async function exportData() {
    setStatus('ok', 'data_working');
    try {
      const photos = await DB.allPhotos();
      const obj = Logic.buildExport({ settings: state.settings, equipment: state.equipment, records: state.records, photoMetas: photos.map((p) => p.meta) }, new Date().toISOString());
      // JPEG は縮まないので無圧縮、data.json は圧縮
      const files = { 'data.json': [fflate.strToU8(JSON.stringify(obj, null, 2)), { level: 6 }] };
      for (const p of photos) files[Logic.photoFile(p.meta.id)] = [new Uint8Array(await p.blob.arrayBuffer()), { level: 0 }];
      const zipped = await zipAsync(files);
      const name = Logic.exportFileName(new Date());
      const url = URL.createObjectURL(new Blob([zipped], { type: 'application/zip' }));
      const a = el('a');
      a.href = url;
      a.download = name;
      document.body.append(a);
      a.click();
      a.remove();
      // すぐ手放すと保存が始まらない端末があるので少し待つ
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      setStatus('ok', 'export_done', { name });
    } catch (err) {
      statusError('err_export_failed', err);
    }
  }

  // 読み込み・検証・サムネイル作成をすべて終えてから書く。途中で失敗したら今のデータは変えない
  async function importData(file) {
    setStatus('ok', 'data_working');
    let files;
    try { files = await unzipAsync(new Uint8Array(await file.arrayBuffer())); } catch { setStatus('error', 'err_import_read'); return; }
    let obj;
    try { obj = JSON.parse(fflate.strFromU8(files['data.json'])); } catch { setStatus('error', 'err_import_shape'); return; }
    const result = Logic.validateImport(obj, Object.keys(files));
    if (!result.ok) { setStatus('error', result.error); return; }
    const { data, dropped } = result;
    const counts = { equipment: data.equipment.length, records: data.records.length, photos: data.photos.length };
    const droppedParams = { de: dropped.equipment, dr: dropped.records, dp: dropped.photos };
    const anyDropped = () => dropped.equipment + dropped.records + dropped.photos > 0;
    setStatus('ok', null);
    if (!(await confirmDialog(anyDropped() ? 'confirm_import_dropped' : 'confirm_import', { ...counts, ...droppedParams }))) return;
    setStatus('ok', 'data_working');
    // サムネイルを作り直す。読めない写真は捨てて photoIds からも外す
    const blobs = new Map();
    const photos = [];
    for (const meta of data.photos) {
      const blob = new Blob([files[Logic.photoFile(meta.id)]], { type: 'image/jpeg' });
      try {
        const t = await Photos.thumbOf(blob);
        blobs.set(meta.id, { blob, thumb: t.thumb });
        photos.push(meta.width && meta.height ? meta : { ...meta, width: t.width, height: t.height });
      } catch {
        dropped.photos++;
      }
    }
    const kept = new Set(photos.map((p) => p.id));
    const strip = (x) => ({ ...x, photoIds: x.photoIds.filter((id) => kept.has(id)) });
    const next = { equipment: data.equipment.map(strip), records: data.records.map(strip), photos };
    try {
      await DB.replaceAll(next, blobs);
    } catch (err) {
      statusError('err_import_failed', err);
      return;
    }
    // 書き込めたら設定も置き換え、メモリの状態を読み直す
    state.settings = data.settings;
    const stored = writeStored();
    forgetAllThumbs();
    try {
      const loaded = await DB.loadAll();
      state.equipment = loaded.equipment;
      state.records = loaded.records;
    } catch {
      state.equipment = next.equipment;
      state.records = next.records;
    }
    state.view = { name: 'list' };
    state.recordsView = { name: 'list' };
    applySettings();
    const params = { equipment: next.equipment.length, records: next.records.length, photos: photos.length, ...droppedParams, dp: dropped.photos };
    if (!stored) setStatus('warn', 'status_storage_unavailable');
    else if (anyDropped()) setStatus('warn', 'import_done_dropped', params);
    else setStatus('ok', 'import_done', params);
    render();
  }

  async function eraseAll() {
    if (!(await confirmDialog('confirm_erase'))) return;
    try {
      await DB.clear();
    } catch (err) {
      statusError('err_delete_failed', err);
      return;
    }
    forgetAllThumbs();
    try { localStorage.removeItem(STORAGE_KEY); } catch { /* 保存できない環境 */ }
    // 初期状態から始め直す(URL のクエリも外す)
    location.replace(location.pathname);
  }

  // ---- サンプルデータ ----
  // サンプルの写真に使う線画(400×300 の座標で描き、1200×900 で書き出す)
  const ART_HEAD = '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 400 300">';
  const ART_LINE = '<g fill="none" stroke="#2b3640" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">';
  const SAMPLE_ART = {
    car: `${ART_HEAD}<rect width="400" height="300" fill="#e3ebf1"/>${ART_LINE}
      <line x1="30" y1="232" x2="370" y2="232"/>
      <path d="M58 204 V168 Q60 148 92 144 L136 138 L172 100 Q180 92 196 92 H262 Q278 92 290 104 L326 140 Q350 144 352 168 V204 Z" fill="#f7f9fb"/>
      <path d="M184 106 L154 138 H236 V106 Z M250 106 V138 H312 L284 106 Z"/>
      <line x1="236" y1="140" x2="236" y2="200"/><line x1="214" y1="156" x2="226" y2="156"/>
      <path d="M340 160 H352 M58 160 H70"/>
      <circle cx="116" cy="206" r="27" fill="#e3ebf1"/><circle cx="116" cy="206" r="10"/>
      <circle cx="294" cy="206" r="27" fill="#e3ebf1"/><circle cx="294" cy="206" r="10"/></g></svg>`,
    forklift: `${ART_HEAD}<rect width="400" height="300" fill="#f1ece0"/>${ART_LINE}
      <line x1="30" y1="244" x2="370" y2="244"/>
      <path d="M120 36 V222 M138 36 V222 M120 36 H138 M120 110 H138 M120 170 H138"/>
      <path d="M138 228 H54 M138 200 V230"/>
      <rect x="56" y="160" width="60" height="62" fill="#fbf8f1"/><path d="M56 191 H116 M86 160 V222"/>
      <path d="M150 220 V150 H272 Q292 150 296 178 V220 Z" fill="#fbf8f1"/>
      <path d="M160 150 L172 66 H252 L264 150 M172 66 L158 150"/>
      <path d="M214 150 V124 H242"/><path d="M186 150 L198 112 L206 116"/>
      <circle cx="176" cy="222" r="21" fill="#f1ece0"/><circle cx="176" cy="222" r="7"/>
      <circle cx="268" cy="222" r="21" fill="#f1ece0"/><circle cx="268" cy="222" r="7"/></g></svg>`,
    compressor: `${ART_HEAD}<rect width="400" height="300" fill="#e6eee3"/>${ART_LINE}
      <line x1="30" y1="262" x2="370" y2="262"/>
      <rect x="66" y="150" width="268" height="84" rx="42" fill="#f6f9f4"/>
      <rect x="104" y="92" width="92" height="58" rx="8" fill="#f6f9f4"/>
      <path d="M120 104 V138 M136 104 V138 M152 104 V138 M168 104 V138 M184 104 V138"/>
      <rect x="216" y="100" width="58" height="50" rx="4" fill="#f6f9f4"/><path d="M196 120 H216"/>
      <path d="M274 124 H296 V132"/><circle cx="306" cy="114" r="18" fill="#f6f9f4"/><path d="M306 114 L316 104"/>
      <path d="M334 186 L364 168 V128"/>
      <path d="M110 234 V246 M290 234 V246"/>
      <circle cx="110" cy="248" r="13" fill="#e6eee3"/><circle cx="290" cy="248" r="13" fill="#e6eee3"/></g></svg>`,
    aircon: `${ART_HEAD}<rect width="400" height="300" fill="#ecebf3"/>${ART_LINE}
      <line x1="30" y1="44" x2="370" y2="44"/>
      <rect x="52" y="64" width="296" height="108" rx="22" fill="#fafafd"/>
      <path d="M70 138 H330 M84 154 H316"/><circle cx="314" cy="96" r="5"/><line x1="76" y1="96" x2="150" y2="96"/>
      <path d="M110 196 q12 14 0 28 t0 28 M200 196 q12 14 0 28 t0 28 M290 196 q12 14 0 28 t0 28"/></g></svg>`,
  };

  // SVG の文字列を Image → canvas で PNG の Blob にする(写真と同じ経路に渡すため)
  function rasterizeArt(svg) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth || 1200;
        canvas.height = img.naturalHeight || 900;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob((b) => (b ? resolve(b) : reject('photo_unreadable')), 'image/png');
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject('photo_unreadable'); };
      img.src = url;
    });
  }

  // 機器も記録も 0 件のときだけ。絵は通常の写真と同じく JPEG の本体とサムネイルにして保存する
  async function loadSample() {
    if (!isEmpty()) return;
    setStatus('ok', 'data_working');
    const sample = Logic.buildSample(state.settings.lang, today(), newId);
    const now = new Date().toISOString();
    const blobs = new Map();
    const photos = [];
    for (const p of sample.photos) {
      try {
        const img = await Photos.prepare(await rasterizeArt(SAMPLE_ART[p.art]));
        blobs.set(p.id, { blob: img.blob, thumb: img.thumb });
        photos.push({ id: p.id, ownerType: p.ownerType, ownerId: p.ownerId, width: img.width, height: img.height, createdAt: now });
      } catch { /* 絵を作れなければ、その機器は写真なしで入れる */ }
    }
    // 作っているあいだに入力されていたら上書きしない
    if (!isEmpty()) { setStatus('ok', null); return; }
    const kept = new Set(photos.map((p) => p.id));
    const equipment = sample.equipment.map((e) => ({ ...e, photoIds: e.photoIds.filter((id) => kept.has(id)) }));
    try {
      await DB.replaceAll({ equipment, records: sample.records, photos }, blobs);
    } catch (err) {
      statusError('err_sample_failed', err);
      return;
    }
    forgetAllThumbs();
    try {
      const loaded = await DB.loadAll();
      state.equipment = loaded.equipment;
      state.records = loaded.records;
    } catch {
      state.equipment = equipment;
      state.records = sample.records;
    }
    state.view = { name: 'list' };
    state.recordsView = { name: 'list' };
    setStatus('ok', 'sample_done', { equipment: state.equipment.length, records: state.records.length });
    render();
  }

  // ---- 描画とタブ ----
  function render() {
    if ($('#sheet').open) return;
    for (const b of $$('#tabbar .tab')) b.setAttribute('aria-selected', String(b.dataset.tab === state.tab));
    for (const p of $$('.tab-pane')) p.hidden = p.dataset.tab !== state.tab;
    renderDbMessage();
    shownDay = today();
    const dues = currentDues();
    renderEquipment(dues);
    renderDues(dues);
    renderRecords();
    renderData();
    if (state.tab === 'settings') updateUsage();
    showStatus();
  }

  // DB が使えないときは main の先頭に理由を出す
  function renderDbMessage() {
    const box = $('#db-message');
    box.hidden = state.db !== 'error' && state.db !== 'closed';
    if (state.db === 'error') {
      box.replaceChildren(el('p', null, tr('err_db_unavailable')));
    } else if (state.db === 'closed') {
      const reload = el('button', 'btn', tr('reload'));
      reload.type = 'button';
      reload.addEventListener('click', () => location.reload());
      box.replaceChildren(el('p', null, tr('db_version_change')), reload);
    } else {
      box.replaceChildren();
    }
  }

  function switchTab(name) {
    if (!Logic.TABS.includes(name)) return;
    state.tab = name;
    render();
  }

  // ---- ツールバー ----
  function resetIdle() {
    $('#toolbar').classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => $('#toolbar').classList.add('idle'), IDLE_MS);
  }

  function bindToolbar() {
    // ヘルプはマニュアルを別タブで開くリンク
    $('#btn-help').href = Logic.supportUrl('manual');
    $('#btn-theme').addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      saveSettings({ theme: next });
    });
    $('#btn-zoom-in').addEventListener('click', () => saveSettings({ zoom: Logic.stepZoom(state.settings.zoom, 1) }));
    $('#btn-zoom-out').addEventListener('click', () => saveSettings({ zoom: Logic.stepZoom(state.settings.zoom, -1) }));
    $('#btn-lang').addEventListener('click', () => saveSettings({ lang: state.settings.lang === 'ja' ? 'en' : 'ja' }));
    for (const ev of ['pointermove', 'pointerdown', 'touchstart', 'keydown']) document.addEventListener(ev, resetIdle, { passive: true });
    resetIdle();
  }

  // ---- 起動 ----
  function init() {
    const query = Logic.parseQuery(location.search);
    state.settings = Logic.mergeSettings(Logic.loadStored(readStored(), navigator.language), query.settings);
    if (query.save && !writeStored()) setStatus('warn', 'status_storage_unavailable');
    if (query.tab) state.tab = query.tab;
    bindSettings();
    bindToolbar();
    bindSheet();
    bindConfirm();
    bindViewer();
    bindEquipment();
    bindRecords();
    for (const b of $$('#tabbar .tab')) b.addEventListener('click', () => switchTab(b.dataset.tab));
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
    // 再読込したら一覧から始める(前の詳細の履歴を持ち越さない)
    history.replaceState(null, '');
    applySettings();
    render();
    startDb();
    setInterval(checkDay, 60000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkDay(); });
  }

  document.addEventListener('DOMContentLoaded', init);

  return { state, render, switchTab, saveSettings, setStatus, openSheet, confirmDialog, showEquipment, openEquipmentSheet, showRecord, openRecordSheet, photoPicker, openPhotoViewer };
})();
