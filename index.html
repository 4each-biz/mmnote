<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>メンテナンス手帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f6f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mmnote">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root {
  --bg: #f6f7f9;
  --bg-panel: #ffffff;
  --fg: #1d2228;
  --fg-muted: #5d6670;
  --border: #d9dde2;
  --accent: #2c6e9b;
  --on-accent: #ffffff;
  --ok: #2f9e55;
  --warn: #d99a00;
  --error: #d14343;
  --backdrop: rgba(0, 0, 0, 0.45);
  --zoom: 1;
  --radius: calc(10px * var(--zoom));
  --gap: calc(12px * var(--zoom));
  --fs-base: calc(16px * var(--zoom));
  --fs-small: calc(13px * var(--zoom));
  --fs-large: calc(22px * var(--zoom));
  --page-width: calc(720px * var(--zoom));
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
html[data-theme="dark"] {
  --bg: #121519;
  --bg-panel: #1b1f24;
  --fg: #e6e9ed;
  --fg-muted: #9aa3ad;
  --border: #2f353c;
  --accent: #6fb3e0;
  --on-accent: #0e1216;
  --backdrop: rgba(0, 0, 0, 0.6);
}
@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) {
    --bg: #121519; --bg-panel: #1b1f24; --fg: #e6e9ed; --fg-muted: #9aa3ad; --border: #2f353c;
    --accent: #6fb3e0; --on-accent: #0e1216; --backdrop: rgba(0, 0, 0, 0.6);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: var(--fs-base);
  line-height: 1.5;
  height: 100dvh;
  max-width: var(--page-width);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }

/* ツールバー */
#toolbar {
  display: flex; justify-content: flex-end; align-items: center; gap: calc(var(--gap) / 2);
  padding: calc(var(--gap) / 2) var(--gap);
  padding-top: max(calc(var(--gap) / 2), env(safe-area-inset-top));
  transition: opacity 0.6s;
}
#toolbar.idle { opacity: 0.15; }
/* 大きな拡大率では幅に収まるまで縮む(44px より小さくはしない) */
.icon-btn {
  flex: 0 1 2.4em; aspect-ratio: 1; min-width: 44px; min-height: 44px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg-panel); color: var(--fg);
  cursor: pointer; display: grid; place-items: center; padding: 0;
}
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.icon-btn svg { width: 1.4em; height: 1.4em; fill: currentColor; }

/* 本文 */
#content { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 var(--gap); }
#page-title { margin: 0 0 calc(var(--gap) / 2); font-size: var(--fs-large); font-weight: 400; }
.tab-pane { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; padding-bottom: var(--gap); }
.tab-pane[hidden] { display: none; }
.empty { color: var(--fg-muted); padding: var(--gap) 0; }

/* ステータス帯 */
#status-bar {
  display: flex; align-items: center; gap: var(--gap);
  padding: calc(var(--gap) / 2) var(--gap);
  border-top: 1px solid var(--border);
  font-size: var(--fs-small); color: var(--fg-muted);
}
#status-counts { flex: none; }
#status-message { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
#status-message[data-level="error"] { color: var(--error); }
#status-dot { flex: none; width: 0.8em; height: 0.8em; border-radius: 50%; background: var(--ok); }
#status-dot[data-level="warn"] { background: var(--warn); }
#status-dot[data-level="error"] { background: var(--error); }

/* タブバー */
#tabbar {
  display: flex; border-top: 1px solid var(--border); background: var(--bg-panel);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex: 1; min-height: max(60px, 3.8em); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: none; border: none; color: var(--fg-muted); cursor: pointer; font-size: var(--fs-small); padding: 4px 0;
}
.tab svg { width: 1.8em; height: 1.8em; fill: currentColor; }
.tab[aria-selected="true"] { color: var(--accent); }

/* 設定タブ */
.settings-section { border-bottom: 1px solid var(--border); padding: calc(var(--gap) / 2) 0; }
.settings-section > summary { cursor: pointer; padding: calc(var(--gap) / 2) 0; min-height: 44px; display: flex; align-items: center; font-size: calc(var(--fs-base) * 1.1); }
.settings-section > summary::before { content: ''; width: 0.5em; height: 0.5em; margin-right: 0.6em; border-right: 2px solid var(--fg-muted); border-bottom: 2px solid var(--fg-muted); transform: rotate(-45deg); transition: transform 0.2s; }
.settings-section[open] > summary::before { transform: rotate(45deg); }
.settings-section > summary::-webkit-details-marker { display: none; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap); align-items: center; margin-bottom: var(--gap); }
.field > label { color: var(--fg-muted); }
.field > input, .field > select { width: 100%; min-width: 0; }

/* 入力欄とボタン */
select, input, textarea, .btn {
  background: var(--bg); border: 1px solid var(--border); border-radius: calc(6px * var(--zoom)); padding: 0.4em 0.6em;
}
input, select, textarea { font-size: max(16px, var(--fs-base)); }
input, select, .btn { min-height: 44px; }
textarea { width: 100%; resize: vertical; }
.btn { cursor: pointer; padding: 0 1em; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { color: var(--error); }

/* シート(下から出る)と確認ダイアログ */
dialog { color: var(--fg); background: var(--bg-panel); border: 1px solid var(--border); padding: var(--gap); }
dialog::backdrop { background: var(--backdrop); }
dialog#sheet {
  width: 100%; max-width: var(--page-width); max-height: 90dvh;
  margin: auto auto 0; border-radius: var(--radius) var(--radius) 0 0; border-bottom: none;
  padding-bottom: max(var(--gap), env(safe-area-inset-bottom));
}
dialog#sheet[open] { display: flex; flex-direction: column; animation: sheet-in 0.2s ease-out; }
@keyframes sheet-in { from { transform: translateY(100%); } to { transform: none; } }
#sheet-form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
#sheet-title { margin: 0 0 var(--gap); font-size: var(--fs-large); font-weight: 400; outline: none; }
#sheet-body { flex: 1; min-height: 0; overflow-y: auto; }
#sheet-error { color: var(--error); min-height: 1.5em; margin: calc(var(--gap) / 2) 0; }
dialog#confirm { width: min(90vw, calc(24em * var(--zoom))); border-radius: var(--radius); }
#confirm-message { margin: 0 0 var(--gap); white-space: pre-wrap; }
.dialog-actions { display: flex; justify-content: flex-end; gap: calc(var(--gap) / 2); }
</style>
</head>

<script id="app-logic">
const Logic = (() => {
  const SETTINGS_VERSION = 1;
  const TABS = ['equipment', 'dues', 'records', 'settings'];
  const DEFAULT_SETTINGS = { theme: 'auto', zoom: 100, lang: 'ja', dueSoonDays: 30, currency: '¥' };
  // 表示だけに効くキー(データの再計算が要らない)
  const DISPLAY_ONLY_KEYS = ['theme', 'zoom', 'lang'];
  const ZOOM_MIN = 50;
  const ZOOM_MAX = 200;
  const ZOOM_STEP = 10;

  // 各キーの検証。正しければ正規化した値、だめなら undefined を返す。
  const VALIDATORS = {
    theme: (v) => (['auto', 'light', 'dark'].includes(v) ? v : undefined),
    lang: (v) => (['ja', 'en'].includes(v) ? v : undefined),
    zoom: (v) => {
      if (typeof v !== 'number' || !Number.isFinite(v)) return undefined;
      const r = Math.round(v / ZOOM_STEP) * ZOOM_STEP;
      return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, r));
    },
    dueSoonDays: (v) => (Number.isInteger(v) && v >= 1 && v <= 180 ? v : undefined),
    currency: (v) => (typeof v === 'string' && Array.from(v).length <= 4 ? v : undefined),
  };
  const NUMERIC_KEYS = ['zoom', 'dueSoonDays'];

  // 文字列で来る値(URL クエリ、入力欄)を型に合わせる
  function coerce(key, value) {
    if (NUMERIC_KEYS.includes(key) && typeof value === 'string') {
      return value.trim() === '' ? NaN : Number(value);
    }
    return value;
  }

  function mergeSettings(base, patch) {
    const out = { ...base };
    if (!patch || typeof patch !== 'object') return out;
    for (const key of Object.keys(DEFAULT_SETTINGS)) {
      if (!(key in patch)) continue;
      const v = VALIDATORS[key](coerce(key, patch[key]));
      if (v !== undefined) out[key] = v;
    }
    return out;
  }

  function detectLang(navigatorLang) {
    return typeof navigatorLang === 'string' && navigatorLang.toLowerCase().startsWith('ja') ? 'ja' : 'en';
  }

  function loadStored(jsonText, navigatorLang) {
    const base = { ...DEFAULT_SETTINGS, lang: detectLang(navigatorLang) };
    if (typeof jsonText !== 'string') return base;
    let raw;
    try { raw = JSON.parse(jsonText); } catch { return base; }
    if (!raw || raw.version !== SETTINGS_VERSION || !raw.settings || typeof raw.settings !== 'object') return base;
    return mergeSettings(base, raw.settings);
  }

  function parseQuery(search) {
    const params = new URLSearchParams(search || '');
    const settings = {};
    for (const key of Object.keys(DEFAULT_SETTINGS)) {
      if (!params.has(key)) continue;
      const v = VALIDATORS[key](coerce(key, params.get(key)));
      if (v !== undefined) settings[key] = v;
    }
    const tab = params.get('tab');
    return { settings, save: params.get('save') === '1', tab: TABS.includes(tab) ? tab : null };
  }

  function stepZoom(current, dir) {
    return VALIDATORS.zoom(current + (dir < 0 ? -ZOOM_STEP : ZOOM_STEP));
  }

  function zoomOptions() {
    const out = [];
    for (let z = ZOOM_MIN; z <= ZOOM_MAX; z += ZOOM_STEP) out.push(z);
    return out;
  }

  function effectiveTheme(setting, prefersDark) {
    if (setting === 'light' || setting === 'dark') return setting;
    return prefersDark ? 'dark' : 'light';
  }

  // ---- データの検証と正規化 ----
  const CATEGORIES = ['vehicle', 'machine', 'facility', 'other'];
  const KINDS = ['inspection', 'repair', 'replacement', 'cleaning', 'other'];
  const LIMITS = { name: 60, title: 80, text: 200, note: 2000, specs: 30, photos: 10, meterUnit: 8 };

  const cpLen = (s) => Array.from(s).length;
  const clip = (s, n) => { const a = Array.from(s); return a.length > n ? a.slice(0, n).join('') : s; };
  const str = (v) => (typeof v === 'string' ? v : '');

  function isDate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const [y, m, d] = s.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
  }
  const isBlank = (v) => v === null || v === undefined || v === '';

  function validateEquipment(e) {
    const errs = [];
    const name = str(e.name).trim();
    if (!name) errs.push('err_name_required');
    else if (cpLen(name) > LIMITS.name) errs.push('err_name_long');
    if (!isBlank(e.acquiredOn) && !isDate(e.acquiredOn)) errs.push('err_date_invalid');
    const texts = [e.maker, e.model, e.serial];
    const specs = Array.isArray(e.specs) ? e.specs : [];
    for (const s of specs) texts.push(s && s.label, s && s.value);
    const tooLong = texts.some((v) => typeof v === 'string' && cpLen(v) > LIMITS.text)
      || specs.length > LIMITS.specs
      || (typeof e.note === 'string' && cpLen(e.note) > LIMITS.note);
    if (tooLong) errs.push('err_text_long');
    return errs;
  }

  function validateRecord(r) {
    const errs = [];
    const title = str(r.title).trim();
    if (!title) errs.push('err_title_required');
    else if (cpLen(title) > LIMITS.title) errs.push('err_title_long');
    const dateOk = isDate(r.date);
    if (!dateOk) errs.push('err_date_invalid');
    if (!isBlank(r.cost) && !(Number.isInteger(r.cost) && r.cost >= 0)) errs.push('err_cost_invalid');
    if (!isBlank(r.meterValue) && !(typeof r.meterValue === 'number' && Number.isFinite(r.meterValue) && r.meterValue >= 0)) errs.push('err_meter_invalid');
    if (!isBlank(r.nextDue)) {
      if (!isDate(r.nextDue)) errs.push('err_date_invalid');
      else if (dateOk && r.nextDue < r.date) errs.push('err_due_before_date');
    }
    const tooLong = (typeof r.vendor === 'string' && cpLen(r.vendor) > LIMITS.text)
      || (typeof r.meterUnit === 'string' && cpLen(r.meterUnit) > LIMITS.meterUnit)
      || (typeof r.note === 'string' && cpLen(r.note) > LIMITS.note);
    if (tooLong) errs.push('err_text_long');
    return [...new Set(errs)];
  }

  const isoOr = (v) => (typeof v === 'string' && v ? v : new Date().toISOString());
  const dateOrNull = (v) => (isDate(v) ? v : null);
  const idList = (v) => (Array.isArray(v) ? v.filter((x) => typeof x === 'string' && x) : []).slice(0, LIMITS.photos);

  function normalizeEquipment(raw) {
    if (!raw || typeof raw !== 'object') return null;
    if (typeof raw.id !== 'string' || !raw.id) return null;
    const name = clip(str(raw.name).trim(), LIMITS.name);
    if (!name) return null;
    const specs = [];
    for (const s of Array.isArray(raw.specs) ? raw.specs : []) {
      if (!s || typeof s !== 'object') continue;
      const cell = (v) => clip(typeof v === 'string' ? v : (typeof v === 'number' && Number.isFinite(v) ? String(v) : ''), LIMITS.text);
      const label = cell(s.label), value = cell(s.value);
      if (!label && !value) continue;
      specs.push({ label, value });
      if (specs.length >= LIMITS.specs) break;
    }
    return {
      id: raw.id,
      name,
      category: CATEGORIES.includes(raw.category) ? raw.category : 'other',
      maker: clip(str(raw.maker), LIMITS.text),
      model: clip(str(raw.model), LIMITS.text),
      serial: clip(str(raw.serial), LIMITS.text),
      acquiredOn: dateOrNull(raw.acquiredOn),
      specs,
      note: clip(str(raw.note), LIMITS.note),
      photoIds: idList(raw.photoIds),
      createdAt: isoOr(raw.createdAt),
      updatedAt: isoOr(raw.updatedAt),
    };
  }

  function normalizeRecord(raw) {
    if (!raw || typeof raw !== 'object') return null;
    if (typeof raw.id !== 'string' || !raw.id) return null;
    if (typeof raw.equipmentId !== 'string' || !raw.equipmentId) return null;
    if (!isDate(raw.date)) return null;
    const title = clip(str(raw.title).trim(), LIMITS.title);
    if (!title) return null;
    return {
      id: raw.id,
      equipmentId: raw.equipmentId,
      date: raw.date,
      kind: KINDS.includes(raw.kind) ? raw.kind : 'other',
      title,
      cost: Number.isInteger(raw.cost) && raw.cost >= 0 ? raw.cost : null,
      vendor: clip(str(raw.vendor), LIMITS.text),
      meterValue: typeof raw.meterValue === 'number' && Number.isFinite(raw.meterValue) && raw.meterValue >= 0 ? raw.meterValue : null,
      meterUnit: clip(str(raw.meterUnit), LIMITS.meterUnit),
      nextDue: dateOrNull(raw.nextDue),
      note: clip(str(raw.note), LIMITS.note),
      photoIds: idList(raw.photoIds),
      createdAt: isoOr(raw.createdAt),
      updatedAt: isoOr(raw.updatedAt),
    };
  }

  function normalizePhotoMeta(raw) {
    if (!raw || typeof raw !== 'object') return null;
    if (typeof raw.id !== 'string' || !raw.id) return null;
    if (raw.ownerType !== 'equipment' && raw.ownerType !== 'record') return null;
    if (typeof raw.ownerId !== 'string' || !raw.ownerId) return null;
    const dim = (v) => (Number.isInteger(v) && v > 0 ? v : 0);
    return { id: raw.id, ownerType: raw.ownerType, ownerId: raw.ownerId, width: dim(raw.width), height: dim(raw.height), createdAt: isoOr(raw.createdAt) };
  }

  const I18N = {
    ja: {
      app_title: 'メンテナンス手帳',
      help: 'ヘルプ',
      toggle_theme: 'ダーク/ライト切り替え',
      zoom_out: '縮小',
      zoom_in: '拡大',
      toggle_lang: 'English に切り替え',
      tab_equipment: '機器',
      tab_dues: '予定',
      tab_records: '記録',
      tab_settings: '設定',
      empty_equipment: '機器はまだありません。',
      empty_dues: '予定はまだありません。',
      empty_records: '記録はまだありません。',
      section_display: '表示',
      set_theme: 'テーマ',
      theme_auto: '端末に合わせる',
      theme_light: 'ライト',
      theme_dark: 'ダーク',
      set_zoom: '拡大率',
      set_lang: '言語',
      lang_ja: '日本語',
      lang_en: 'English',
      set_due_soon_days: '期限間近の日数',
      set_currency: '通貨記号',
      ok: 'OK',
      cancel: 'キャンセル',
      status_counts: '機器 {equipment} / 記録 {records}',
      status_settings_saved: '設定を保存しました',
      status_storage_unavailable: '設定を保存できません',
      err_save_failed: '保存できませんでした: {reason}',
      err_name_required: '名前を入力してください',
      err_name_long: '名前は 60 字以内にしてください',
      err_title_required: '作業内容を入力してください',
      err_title_long: '作業内容は 80 字以内にしてください',
      err_date_invalid: '日付が正しくありません',
      err_cost_invalid: '費用は 0 以上の整数で入力してください',
      err_meter_invalid: '計器の値は 0 以上の数で入力してください',
      err_due_before_date: '次回予定日は実施日以降にしてください',
      err_text_long: '長すぎる項目があります',
    },
    en: {
      app_title: 'Maintenance Notebook',
      help: 'Help',
      toggle_theme: 'Toggle dark/light',
      zoom_out: 'Zoom out',
      zoom_in: 'Zoom in',
      toggle_lang: '日本語に切り替え',
      tab_equipment: 'Equipment',
      tab_dues: 'Due',
      tab_records: 'Records',
      tab_settings: 'Settings',
      empty_equipment: 'No equipment yet.',
      empty_dues: 'Nothing is scheduled yet.',
      empty_records: 'No records yet.',
      section_display: 'Display',
      set_theme: 'Theme',
      theme_auto: 'Match device',
      theme_light: 'Light',
      theme_dark: 'Dark',
      set_zoom: 'Zoom',
      set_lang: 'Language',
      lang_ja: '日本語',
      lang_en: 'English',
      set_due_soon_days: 'Days before "due soon"',
      set_currency: 'Currency symbol',
      ok: 'OK',
      cancel: 'Cancel',
      status_counts: 'Equipment {equipment} / Records {records}',
      status_settings_saved: 'Settings saved',
      status_storage_unavailable: 'Settings cannot be saved',
      err_save_failed: 'Could not save: {reason}',
      err_name_required: 'Enter a name',
      err_name_long: 'Name must be 60 characters or fewer',
      err_title_required: 'Enter what was done',
      err_title_long: 'Title must be 80 characters or fewer',
      err_date_invalid: 'The date is not valid',
      err_cost_invalid: 'Cost must be a whole number, 0 or more',
      err_meter_invalid: 'Meter value must be a number, 0 or more',
      err_due_before_date: 'Next due must be on or after the date',
      err_text_long: 'Some fields are too long',
    },
  };

  function t(lang, key, params) {
    const dict = I18N[lang] || I18N.ja;
    let s = dict[key] ?? key;
    if (params) {
      for (const [k, v] of Object.entries(params)) s = s.replaceAll(`{${k}}`, () => String(v));
    }
    return s;
  }

  return {
    SETTINGS_VERSION, TABS, DEFAULT_SETTINGS, DISPLAY_ONLY_KEYS,
    mergeSettings, detectLang, loadStored, parseQuery, stepZoom, zoomOptions, effectiveTheme,
    CATEGORIES, KINDS, LIMITS, isDate,
    validateEquipment, validateRecord, normalizeEquipment, normalizeRecord, normalizePhotoMeta,
    I18N, t,
  };
})();
</script>
<script id="app-ui">
const App = (() => {
  const STORAGE_KEY = 'mmnote';
  const IDLE_MS = 10000;

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));
  const tr = (key, params) => Logic.t(state.settings.lang, key, params);

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // ---- 状態 ----
  const state = {
    settings: { ...Logic.DEFAULT_SETTINGS },
    equipment: [],
    records: [],
    tab: 'equipment',
    view: { name: 'list' },
  };
  let lastStatus = { level: 'ok', key: null, params: null };
  let idleTimer = null;

  // ---- 設定 ----
  function readStored() {
    try { return localStorage.getItem(STORAGE_KEY); } catch { return null; }
  }

  function writeStored() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: Logic.SETTINGS_VERSION, settings: state.settings }));
      return true;
    } catch { return false; }
  }

  function saveSettings(patch) {
    state.settings = Logic.mergeSettings(state.settings, patch);
    if (writeStored()) setStatus('ok', 'status_settings_saved');
    else setStatus('warn', 'status_storage_unavailable');
    applySettings();
    render();
  }

  function applyI18n() {
    document.documentElement.lang = state.settings.lang;
    document.title = tr('app_title');
    for (const e of $$('[data-i18n]')) e.textContent = tr(e.dataset.i18n);
    for (const e of $$('[data-i18n-label]')) e.setAttribute('aria-label', tr(e.dataset.i18nLabel));
  }

  function applyTheme() {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = Logic.effectiveTheme(state.settings.theme, prefersDark);
    document.documentElement.dataset.theme = theme;
    // アイコンは切り替え先を表す(ライト表示中は月)
    $('#btn-theme use').setAttribute('href', theme === 'dark' ? '#icon-light-mode' : '#icon-dark-mode');
    $('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  }

  function applyZoom() {
    const zoom = state.settings.zoom;
    document.documentElement.style.setProperty('--zoom', String(zoom / 100));
    $('#btn-zoom-in').disabled = Logic.stepZoom(zoom, 1) === zoom;
    $('#btn-zoom-out').disabled = Logic.stepZoom(zoom, -1) === zoom;
  }

  function applySettings() {
    applyI18n();
    applyTheme();
    applyZoom();
    for (const e of $$('[data-setting]')) e.value = String(state.settings[e.dataset.setting]);
    showStatus();
  }

  // ---- 共通部品(シート、ステータス、確認) ----
  function setStatus(level, key, params) {
    lastStatus = { level, key, params: params || null };
    showStatus();
  }

  function showStatus() {
    $('#status-counts').textContent = tr('status_counts', { equipment: state.equipment.length, records: state.records.length });
    const msg = $('#status-message');
    msg.dataset.level = lastStatus.level;
    msg.textContent = lastStatus.key ? tr(lastStatus.key, lastStatus.params) : '';
    $('#status-dot').dataset.level = lastStatus.level;
  }

  let sheet = null; // 開いているシートの { validate, onOk, busy }

  // 入力のたびに validate を呼び、エラーのあいだは OK を無効にする
  function checkSheet() {
    if (!sheet) return;
    const errKey = sheet.validate ? sheet.validate() : null;
    $('#sheet-error').textContent = errKey ? tr(errKey) : '';
    $('#sheet-ok').disabled = !!errKey || sheet.busy;
    return !errKey;
  }

  function errorText(err) {
    if (typeof err === 'string') return tr(err);
    if (err && err.key) return tr(err.key, err.params);
    return tr('err_save_failed', { reason: (err && err.message) || String(err) });
  }

  function openSheet({ title, build, validate = null, onOk }) {
    const dlg = $('#sheet');
    const body = $('#sheet-body');
    $('#sheet-title').textContent = title;
    body.replaceChildren();
    sheet = { validate, onOk, busy: false };
    build(body);
    checkSheet();
    dlg.showModal();
    // 日付欄に自動でフォーカスすると iOS でピッカーが開くので、見出しへ移す
    $('#sheet-title').focus();
  }

  async function submitSheet() {
    if (!sheet || sheet.busy || !checkSheet()) return;
    const current = sheet;
    current.busy = true;
    checkSheet();
    try {
      if (current.onOk) await current.onOk();
      current.busy = false;
      closeSheet();
    } catch (err) {
      current.busy = false;
      checkSheet();
      $('#sheet-error').textContent = errorText(err);
    }
  }

  function closeSheet() {
    sheet = null;
    if ($('#sheet').open) $('#sheet').close();
    render();
  }

  function bindSheet() {
    $('#sheet-form').addEventListener('submit', (ev) => { ev.preventDefault(); submitSheet(); });
    $('#sheet-body').addEventListener('input', checkSheet);
    $('#sheet-body').addEventListener('change', checkSheet);
    $('#sheet-cancel').addEventListener('click', () => { if (!sheet || !sheet.busy) closeSheet(); });
    // Esc で閉じるときも同じ後始末をする(保存中は閉じない)
    $('#sheet').addEventListener('cancel', (ev) => {
      ev.preventDefault();
      if (!sheet || !sheet.busy) closeSheet();
    });
  }

  let confirmResolve = null;

  function confirmDialog(messageKey, params) {
    $('#confirm-message').textContent = tr(messageKey, params);
    $('#confirm').showModal();
    return new Promise((resolve) => { confirmResolve = resolve; });
  }

  function finishConfirm(result) {
    const resolve = confirmResolve;
    confirmResolve = null;
    if ($('#confirm').open) $('#confirm').close();
    if (resolve) resolve(result);
  }

  function bindConfirm() {
    $('#confirm-ok').addEventListener('click', () => finishConfirm(true));
    $('#confirm-cancel').addEventListener('click', () => finishConfirm(false));
    $('#confirm').addEventListener('cancel', (ev) => { ev.preventDefault(); finishConfirm(false); });
  }

  // ---- 設定タブ ----
  function bindSettings() {
    const zoomSel = $('#set-zoom');
    for (const z of Logic.zoomOptions()) {
      const o = el('option', null, `${z}%`);
      o.value = String(z);
      zoomSel.append(o);
    }
    for (const e of $$('[data-setting]')) {
      e.addEventListener('change', () => {
        // 不正な値は mergeSettings が捨てるので、欄は今の設定に戻る
        saveSettings({ [e.dataset.setting]: e.value });
      });
    }
  }

  // ---- 描画とタブ ----
  function render() {
    if ($('#sheet').open) return;
    for (const b of $$('#tabbar .tab')) b.setAttribute('aria-selected', String(b.dataset.tab === state.tab));
    for (const p of $$('.tab-pane')) p.hidden = p.dataset.tab !== state.tab;
    showStatus();
  }

  function switchTab(name) {
    if (!Logic.TABS.includes(name)) return;
    state.tab = name;
    render();
  }

  // ---- ツールバー ----
  function resetIdle() {
    $('#toolbar').classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => $('#toolbar').classList.add('idle'), IDLE_MS);
  }

  function bindToolbar() {
    // ヘルプはマニュアルへのリンクにする(後続のタスク)
    $('#btn-theme').addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      saveSettings({ theme: next });
    });
    $('#btn-zoom-in').addEventListener('click', () => saveSettings({ zoom: Logic.stepZoom(state.settings.zoom, 1) }));
    $('#btn-zoom-out').addEventListener('click', () => saveSettings({ zoom: Logic.stepZoom(state.settings.zoom, -1) }));
    $('#btn-lang').addEventListener('click', () => saveSettings({ lang: state.settings.lang === 'ja' ? 'en' : 'ja' }));
    for (const ev of ['pointermove', 'pointerdown', 'touchstart', 'keydown']) document.addEventListener(ev, resetIdle, { passive: true });
    resetIdle();
  }

  // ---- 起動 ----
  function init() {
    const query = Logic.parseQuery(location.search);
    state.settings = Logic.mergeSettings(Logic.loadStored(readStored(), navigator.language), query.settings);
    if (query.save && !writeStored()) setStatus('warn', 'status_storage_unavailable');
    if (query.tab) state.tab = query.tab;
    bindSettings();
    bindToolbar();
    bindSheet();
    bindConfirm();
    for (const b of $$('#tabbar .tab')) b.addEventListener('click', () => switchTab(b.dataset.tab));
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
    applySettings();
    render();
  }

  document.addEventListener('DOMContentLoaded', init);

  return { state, render, switchTab, saveSettings, setStatus, openSheet, confirmDialog };
})();
</script>
